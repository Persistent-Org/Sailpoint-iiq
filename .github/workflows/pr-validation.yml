name: CI - Build & Validate (SailPoint IIQ)

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "bugfix/**"

  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  CONFIG_DIR: "config"
  SPTARGET: "sandbox"
  WAR_PATH: "build/deploy/identityiq.war"

jobs:

  # =========================================================
  # JOB 1 - VALIDATION
  # =========================================================
  validate:
    name: Validate SailPoint Changes
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Validate SSB repository structure
      # -------------------------------------------------------
      - name: Validate SSB Structure
        shell: bash
        run: |
          echo "Validating SailPoint SSB structure..."

          status=0

          required_files=(
            "build.xml"
            "build.properties"
          )

          required_dirs=(
            "config"
            "scripts"
            "src"
            "lib"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              status=1
            else
              echo "PASS: $file"
            fi
          done

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir directory is missing"
              status=1
            else
              echo "PASS: $dir"
            fi
          done

          exit "$status"

      # -------------------------------------------------------
      # Install XML lint module
      # -------------------------------------------------------
      - name: Install XML Lint Module
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils

          xmllint --version

      # -------------------------------------------------------
      # Validate IIQ XML
      # -------------------------------------------------------
      - name: Lint IIQ XML Files
        shell: bash
        run: |
          echo "Validating XML files..."

          status=0
          count=0

          if [ ! -d "$CONFIG_DIR" ]; then
            echo "::error::Configuration directory $CONFIG_DIR does not exist"
            exit 1
          fi

          while IFS= read -r -d '' file; do

            count=$((count + 1))

            echo "Checking: $file"

            if ! xmllint --noout "$file" 2>/tmp/xml_error; then

              echo "::error file=$file::$(head -n 1 /tmp/xml_error)"
              status=1

            else

              echo "PASS: $file"

            fi

          done < <(find "$CONFIG_DIR" -type f -name "*.xml" -print0)

          echo "Checked $count XML files"

          exit "$status"

      # -------------------------------------------------------
      # Secret scanning
      # -------------------------------------------------------
      - name: Scan Repository for Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =========================================================
  # JOB 2 - BUILD ENVIRONMENT VALIDATION
  # =========================================================
  build-validation:
    name: Build and Security Validation
    needs: validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # OpenJDK 17
      # -------------------------------------------------------
      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java
        shell: bash
        run: |
          echo "Java configuration:"
          java -version

      # -------------------------------------------------------
      # Apache Ant
      # -------------------------------------------------------
      - name: Install Apache Ant
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant

          echo "Ant configuration:"
          ant -version

      # -------------------------------------------------------
      # Check build targets
      # -------------------------------------------------------
      - name: Verify SSB Ant Configuration
        shell: bash
        run: |
          echo "Available Ant targets:"
          ant -p

      # -------------------------------------------------------
      # Check for required IdentityIQ base binary
      #
      # Build remains blocked until the licensed IIQ GA
      # distribution is made available.
      # -------------------------------------------------------
      - name: Check IdentityIQ Base Package
        id: iiq-base
        shell: bash
        run: |
          echo "Checking base/ga for IdentityIQ GA package..."

          IIQ_PACKAGE=$(find base/ga \
            -maxdepth 1 \
            -type f \
            ! -name ".keep" \
            | head -n 1)

          if [ -z "$IIQ_PACKAGE" ]; then

            echo "IdentityIQ GA package is currently unavailable."
            echo "SSB compilation, dependency scanning and WAR generation will be skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"

          else

            echo "IdentityIQ base package found."
            echo "Package: $IIQ_PACKAGE"
            echo "available=true" >> "$GITHUB_OUTPUT"

          fi

      # -------------------------------------------------------
      # Compile/build SSB
      #
      # No JUnit step - unit tests are not part of current POC.
      # -------------------------------------------------------
      - name: Compile and Validate SSB
        if: steps.iiq-base.outputs.available == 'true'
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          echo "Building for environment: $SPTARGET"

          ant main

      # -------------------------------------------------------
      # Dependency/security scan
      # -------------------------------------------------------
      - name: Run Dependency Security Check
        if: steps.iiq-base.outputs.available == 'true'
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          ant dependency-check

      # -------------------------------------------------------
      # Publish security report
      # -------------------------------------------------------
      - name: Publish Dependency Check Reports
        if: always() && steps.iiq-base.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: build/dependency-check-reports/**
          if-no-files-found: ignore


  # =========================================================
  # JOB 3 - BUILD AND PUBLISH ARTIFACT
  # =========================================================
  build-artifact:
    name: Build and Publish IdentityIQ Artifact
    needs:
      - validate
      - build-validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Apache Ant
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant

          ant -version

      # -------------------------------------------------------
      # Check IdentityIQ binary again because each GitHub job
      # runs on a fresh runner
      # -------------------------------------------------------
      - name: Check IdentityIQ Base Package
        id: iiq-base
        shell: bash
        run: |
          IIQ_PACKAGE=$(find base/ga \
            -maxdepth 1 \
            -type f \
            ! -name ".keep" \
            | head -n 1)

          if [ -z "$IIQ_PACKAGE" ]; then

            echo "IdentityIQ GA package is unavailable."
            echo "Artifact build will be skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"

          else

            echo "IdentityIQ base package found."
            echo "available=true" >> "$GITHUB_OUTPUT"

          fi

      # -------------------------------------------------------
      # Build WAR
      # -------------------------------------------------------
      - name: Build IdentityIQ WAR
        if: steps.iiq-base.outputs.available == 'true'
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          ant war

      # -------------------------------------------------------
      # Verify, version and checksum
      # -------------------------------------------------------
      - name: Version Deployment Artifact
        if: steps.iiq-base.outputs.available == 'true'
        id: artifact
        shell: bash
        run: |
          if [ ! -f "$WAR_PATH" ]; then

            echo "::error::WAR not found at $WAR_PATH"
            exit 1

          fi

          SHORT_SHA="${GITHUB_SHA::7}"

          ARTIFACT_NAME="identityiq-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          mkdir -p dist

          cp "$WAR_PATH" "dist/${ARTIFACT_NAME}.war"

          cd dist

          sha256sum "${ARTIFACT_NAME}.war" \
            > "${ARTIFACT_NAME}.war.sha256"

          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          echo "Created artifact: ${ARTIFACT_NAME}.war"

      # -------------------------------------------------------
      # Publish WAR
      # -------------------------------------------------------
      - name: Publish IdentityIQ Artifact
        if: steps.iiq-base.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      # -------------------------------------------------------
      # Status while GA binary is unavailable
      # -------------------------------------------------------
      - name: Report Pending Build Dependency
        if: steps.iiq-base.outputs.available != 'true'
        shell: bash
        run: |
          echo "CI validation completed."
          echo "IdentityIQ build/artifact generation is pending."
          echo "Reason: IdentityIQ 8.3 GA base package is not yet available in base/ga."
