name: SailPoint PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate:
    name: SailPoint PR Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Changed Files
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD

      - name: Check Required SSB Files
        shell: bash
        run: |
          test -f build.xml || { echo "build.xml missing"; exit 1; }
          test -d config || { echo "config folder missing"; exit 1; }
          test -d scripts || { echo "scripts folder missing"; exit 1; }
          echo "Required SSB structure found"

      - name: Validate XML Files
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          failed = False

          for path in pathlib.Path(".").rglob("*.xml"):
              if ".git" in path.parts:
                  continue

              try:
                  ET.parse(path)
                  print(f"PASS: {path}")
              except ET.ParseError as exc:
                  print(f"FAIL: {path}: {exc}")
                  failed = True

          if failed:
              raise SystemExit(1)

          print("XML validation completed successfully")
          PY

      - name: Validation Summary
        run: |
          echo "SailPoint PR validation passed"
