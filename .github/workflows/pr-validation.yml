name: CI - Build & Validate (SailPoint IIQ)

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "bugfix/**"

  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  CONFIG_DIR: "config"
  SPTARGET: "sandbox"
  WAR_PATH: "build/deploy/identityiq.war"

jobs:

  # =========================================================
  # JOB 1 - VALIDATE
  # =========================================================
  validate:
    name: Validate SailPoint Changes
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SSB Structure
        shell: bash
        run: |
          echo "Validating SailPoint SSB structure..."

          status=0

          required_files=(
            "build.xml"
            "build.properties"
          )

          required_dirs=(
            "config"
            "scripts"
            "src"
            "lib"
            "base"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              status=1
            else
              echo "PASS: $file"
            fi
          done

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir directory is missing"
              status=1
            else
              echo "PASS: $dir"
            fi
          done

          exit "$status"

      - name: Install XML Lint
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          xmllint --version

      - name: Validate IIQ XML Files
        shell: bash
        run: |
          echo "Validating IIQ XML files under $CONFIG_DIR..."

          status=0
          count=0

          while IFS= read -r -d '' file; do
            count=$((count + 1))

            echo "Checking: $file"

            if ! xmllint --noout "$file" 2>/tmp/xml_error; then
              echo "::error file=$file::$(head -n 1 /tmp/xml_error)"
              status=1
            else
              echo "PASS: $file"
            fi

          done < <(find "$CONFIG_DIR" -type f -name "*.xml" -print0)

          echo "Checked $count XML files"

          exit "$status"

      - name: Scan Repository for Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================
  # JOB 2 - BUILD AND SECURITY VALIDATION
  # =========================================================
  build:
    name: Build and Security Validation
    needs: validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java
        run: |
          java -version

      - name: Install Apache Ant
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant
          ant -version

      - name: Verify SSB Ant Configuration
        shell: bash
        run: |
          ant -p

      # This step intentionally fails until the GA package
      # is available. It prevents a misleading green build.
      - name: Verify IdentityIQ 8.3 GA Package
        shell: bash
        run: |
          echo "Checking IdentityIQ base package..."

          IIQ_PACKAGE=$(find base/ga \
            -maxdepth 1 \
            -type f \
            ! -name ".keep" \
            | head -n 1)

          if [ -z "$IIQ_PACKAGE" ]; then
            echo "::error::IdentityIQ 8.3 GA package is missing from base/ga"
            exit 1
          fi

          echo "IdentityIQ package found: $IIQ_PACKAGE"

      # No unit tests required for the current scope.
      - name: Compile and Validate SSB
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          echo "Building for environment: $SPTARGET"

          ant main

      - name: Run Dependency Security Check
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          ant dependency-check

      - name: Publish Dependency Check Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: build/dependency-check-reports/**
          if-no-files-found: ignore

  # =========================================================
  # JOB 3 - BUILD AND PUBLISH ARTIFACT
  # =========================================================
  artifact:
    name: Build and Publish IdentityIQ Artifact
    needs:
      - validate
      - build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Apache Ant
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant
          ant -version

      - name: Build IdentityIQ WAR
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          ant war

      - name: Verify and Version Artifact
        id: artifact
        shell: bash
        run: |
          if [ ! -f "$WAR_PATH" ]; then
            echo "::error::WAR not found at $WAR_PATH"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          ARTIFACT_NAME="identityiq-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          mkdir -p dist

          cp "$WAR_PATH" "dist/${ARTIFACT_NAME}.war"

          cd dist

          sha256sum "${ARTIFACT_NAME}.war" \
            > "${ARTIFACT_NAME}.war.sha256"

          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          echo "Artifact: ${ARTIFACT_NAME}.war"
          cat "${ARTIFACT_NAME}.war.sha256"

      - name: Publish IdentityIQ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error
