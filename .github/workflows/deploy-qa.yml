name: CD - Deploy SailPoint IIQ to QAs

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Successful CI workflow run ID"
        required: true
        type: string

      artifact_name:
        description: "CI artifact name, for example identityiq-5-4b4a866"
        required: true
        type: string

      change_reference:
        description: "Change reference"
        required: false
        default: "QA-POC"
        type: string

concurrency:
  group: sailpoint-qa-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-qa:
    name: Deploy IdentityIQ WAR to QA

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 45

    env:
      TOMCAT_SERVICE: 'Tomcat9'
      TOMCAT_HOME: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0'
      WEBAPPS_PATH: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps'
      CURRENT_WAR: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq.war'
      EXPANDED_APP: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq'
      ROLLBACK_ROOT: 'C:\SailPoint-Rollback'
      QA_URL: 'http://localhost:8080/identityiq/login.jsf'
      DOWNLOAD_PATH: '${{ github.workspace }}\downloaded-artifact'

    steps:

      # =======================================================
      # 1. Deployment information
      # =======================================================
      - name: Show Deployment Information
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "SailPoint IdentityIQ QA Deployment"
          Write-Host "========================================"
          Write-Host "Runner machine: $env:COMPUTERNAME"
          Write-Host "Runner account: $(whoami)"
          Write-Host "CI run ID: ${{ inputs.ci_run_id }}"
          Write-Host "Artifact: ${{ inputs.artifact_name }}"
          Write-Host "Change reference: ${{ inputs.change_reference }}"
          Write-Host "QA URL: $env:QA_URL"

      # =======================================================
      # 2. Validate QA server
      # =======================================================
      - name: Validate QA Deployment Prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking QA deployment prerequisites..."

          if (-not (Test-Path $env:WEBAPPS_PATH)) {
            throw "Tomcat webapps path not found"
          }

          if (-not (Test-Path $env:CURRENT_WAR)) {
            throw "Current identityiq.war not found"
          }

          if (-not (Test-Path $env:EXPANDED_APP)) {
            throw "Expanded IdentityIQ application not found"
          }

          $tomcat = Get-Service `
            -Name $env:TOMCAT_SERVICE `
            -ErrorAction Stop

          Write-Host "Tomcat status: $($tomcat.Status)"

          $testFile = Join-Path `
            $env:WEBAPPS_PATH `
            "github-runner-permission-test.tmp"

          try {
            Set-Content `
              -Path $testFile `
              -Value "permission test" `
              -ErrorAction Stop

            Remove-Item `
              -Path $testFile `
              -Force `
              -ErrorAction Stop

            Write-Host "Runner has write access to webapps."
          }
          catch {
            throw "Runner cannot write to Tomcat webapps: $($_.Exception.Message)"
          }

      # =======================================================
      # 3. Prepare download directory
      # =======================================================
      - name: Prepare Download Directory
        shell: powershell
        run: |
          if (Test-Path $env:DOWNLOAD_PATH) {
            Remove-Item `
              -Path $env:DOWNLOAD_PATH `
              -Recurse `
              -Force
          }

          New-Item `
            -Path $env:DOWNLOAD_PATH `
            -ItemType Directory `
            -Force | Out-Null

          Write-Host "Download directory created:"
          Write-Host $env:DOWNLOAD_PATH

      # =======================================================
      # 4. Download CI artifact
      # =======================================================
      - name: Download CI WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.DOWNLOAD_PATH }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # =======================================================
      # 5. Locate downloaded files
      # =======================================================
      - name: Locate Downloaded WAR
        id: downloaded-war
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Downloaded files:"

          Get-ChildItem `
            -Path $env:DOWNLOAD_PATH `
            -Recurse

          $war = Get-ChildItem `
            -Path $env:DOWNLOAD_PATH `
            -Filter "*.war" `
            -Recurse |
            Select-Object -First 1

          if (-not $war) {
            throw "WAR file not found in CI artifact"
          }

          $checksum = Get-ChildItem `
            -Path $env:DOWNLOAD_PATH `
            -Filter "*.war.sha256" `
            -Recurse |
            Select-Object -First 1

          if (-not $checksum) {
            throw "SHA256 checksum file not found"
          }

          Write-Host "WAR: $($war.FullName)"
          Write-Host "Checksum: $($checksum.FullName)"

          "war_path=$($war.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          "checksum_path=$($checksum.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

      # =======================================================
      # 6. Verify WAR SHA256
      # =======================================================
      - name: Verify WAR SHA256
        shell: powershell
        env:
          DOWNLOADED_WAR: ${{ steps.downloaded-war.outputs.war_path }}
          CHECKSUM_FILE: ${{ steps.downloaded-war.outputs.checksum_path }}
        run: |
          $ErrorActionPreference = "Stop"

          $checksumContent = (
            Get-Content `
              -Path $env:CHECKSUM_FILE `
              -Raw
          ).Trim()

          $expectedHash = (
            $checksumContent -split "\s+"
          )[0].ToUpperInvariant()

          $actualHash = (
            Get-FileHash `
              -Path $env:DOWNLOADED_WAR `
              -Algorithm SHA256
          ).Hash.ToUpperInvariant()

          Write-Host "Expected: $expectedHash"
          Write-Host "Actual:   $actualHash"

          if ($expectedHash -ne $actualHash) {
            throw "WAR checksum verification failed"
          }

          Write-Host "WAR checksum verification successful"

      # =======================================================
      # 7. Backup existing QA WAR
      # =======================================================
      - name: Create Rollback Backup
        id: rollback
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          $rollbackFolder = Join-Path `
            $env:ROLLBACK_ROOT `
            $timestamp

          New-Item `
            -Path $rollbackFolder `
            -ItemType Directory `
            -Force | Out-Null

          $rollbackWar = Join-Path `
            $rollbackFolder `
            "identityiq.war"

          Copy-Item `
            -Path $env:CURRENT_WAR `
            -Destination $rollbackWar `
            -Force

          $backupHash = (
            Get-FileHash `
              -Path $rollbackWar `
              -Algorithm SHA256
          ).Hash

          Set-Content `
            -Path (
              Join-Path `
                $rollbackFolder `
                "identityiq.war.sha256"
            ) `
            -Value "$backupHash identityiq.war"

          Write-Host "Rollback backup created:"
          Write-Host $rollbackFolder

          "rollback_folder=$rollbackFolder" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          "rollback_war=$rollbackWar" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

      # =======================================================
      # 8. Stop Tomcat
      # =======================================================
      - name: Stop Tomcat
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Stopping Tomcat..."

          Stop-Service `
            -Name $env:TOMCAT_SERVICE `
            -Force

          $tomcat = Get-Service `
            -Name $env:TOMCAT_SERVICE

          $tomcat.WaitForStatus(
            "Stopped",
            (New-TimeSpan -Seconds 60)
          )

          Write-Host "Tomcat stopped successfully"

      # =======================================================
      # 9. Remove expanded application
      # =======================================================
      - name: Remove Existing Expanded IdentityIQ
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path $env:EXPANDED_APP) {
            Write-Host "Removing existing expanded IdentityIQ folder..."

            Remove-Item `
              -Path $env:EXPANDED_APP `
              -Recurse `
              -Force
          }

          Write-Host "Existing deployment folder removed"

      # =======================================================
      # 10. Replace WAR
      # =======================================================
      - name: Deploy New IdentityIQ WAR
        shell: powershell
        env:
          DOWNLOADED_WAR: ${{ steps.downloaded-war.outputs.war_path }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Deploying CI-generated IdentityIQ WAR..."

          Copy-Item `
            -Path $env:DOWNLOADED_WAR `
            -Destination $env:CURRENT_WAR `
            -Force

          Write-Host "WAR deployed successfully"

          Get-Item $env:CURRENT_WAR |
            Format-List FullName, Length, LastWriteTime

      # =======================================================
      # 11. Start Tomcat
      # =======================================================
      - name: Start Tomcat
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting Tomcat..."

          Start-Service `
            -Name $env:TOMCAT_SERVICE

          $tomcat = Get-Service `
            -Name $env:TOMCAT_SERVICE

          $tomcat.WaitForStatus(
            "Running",
            (New-TimeSpan -Seconds 90)
          )

          Write-Host "Tomcat started successfully"

      # =======================================================
      # 12. Wait for IdentityIQ
      # =======================================================
      - name: Wait for IdentityIQ Startup
        shell: powershell
        run: |
          Write-Host "Waiting for IdentityIQ startup..."
          Start-Sleep -Seconds 45

      # =======================================================
      # 13. Smoke test
      # =======================================================
      - name: Smoke Test IdentityIQ
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $success = $false

          for ($attempt = 1; $attempt -le 12; $attempt++) {

            Write-Host "Smoke test attempt $attempt of 12"

            try {
              $response = Invoke-WebRequest `
                -Uri $env:QA_URL `
                -UseBasicParsing `
                -TimeoutSec 20

              Write-Host "HTTP Status: $($response.StatusCode)"

              if ($response.StatusCode -eq 200) {
                $success = $true
                break
              }
            }
            catch {
              Write-Host "IdentityIQ not ready yet"
            }

            Start-Sleep -Seconds 10
          }

          if (-not $success) {
            throw "IdentityIQ QA smoke test failed"
          }

          Write-Host "IdentityIQ QA smoke test PASSED"

      # =======================================================
      # 14. Automatic rollback
      # =======================================================
      - name: Rollback Previous IdentityIQ WAR
        if: failure() && steps.rollback.outputs.rollback_war != ''
        shell: powershell
        env:
          ROLLBACK_WAR: ${{ steps.rollback.outputs.rollback_war }}
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Deployment failed."
          Write-Host "Starting automatic rollback..."

          Stop-Service `
            -Name $env:TOMCAT_SERVICE `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          if (Test-Path $env:EXPANDED_APP) {
            Remove-Item `
              -Path $env:EXPANDED_APP `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $env:ROLLBACK_WAR)) {
            throw "Rollback WAR does not exist"
          }

          Copy-Item `
            -Path $env:ROLLBACK_WAR `
            -Destination $env:CURRENT_WAR `
            -Force

          Write-Host "Previous WAR restored"

          Start-Service `
            -Name $env:TOMCAT_SERVICE

          Start-Sleep -Seconds 45

          $response = Invoke-WebRequest `
            -Uri $env:QA_URL `
            -UseBasicParsing `
            -TimeoutSec 20

          Write-Host "Rollback HTTP Status:"
          Write-Host $response.StatusCode

          if ($response.StatusCode -ne 200) {
            throw "Rollback validation failed"
          }

          Write-Host "Rollback completed successfully"

      # =======================================================
      # 15. Deployment summary
      # =======================================================
      - name: Publish Deployment Summary
        if: success()
        shell: powershell
        run: |
          $deployedHash = (
            Get-FileHash `
              -Path $env:CURRENT_WAR `
              -Algorithm SHA256
          ).Hash

          Write-Host "========================================"
          Write-Host "QA Deployment Successful"
          Write-Host "========================================"
          Write-Host "Artifact: ${{ inputs.artifact_name }}"
          Write-Host "CI Run: ${{ inputs.ci_run_id }}"
          Write-Host "Change: ${{ inputs.change_reference }}"
          Write-Host "QA URL: $env:QA_URL"
          Write-Host "WAR SHA256: $deployedHash"
          Write-Host "Rollback folder:"
          Write-Host "${{ steps.rollback.outputs.rollback_folder }}"
