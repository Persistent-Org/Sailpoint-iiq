name: CD - Deploy SailPoint IIQ to QA

on:
  push:
    branches:
      - "feature/iiq85-qa-cd-pipeline"

  workflow_dispatch:

concurrency:
  group: sailpoint-qa-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-qa:
    name: Deploy IdentityIQ WAR to QA

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 45

    env:
      # Temporary POC values.
      # Update these to your latest successful CI run/artifact.
      CI_RUN_ID: '40853891873'
      ARTIFACT_NAME: 'identityiq-5-4b4a866'
      CHANGE_REFERENCE: 'QA-POC'

      TOMCAT_SERVICE: 'Tomcat9'
      WEBAPPS_PATH: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps'
      CURRENT_WAR: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq.war'
      EXPANDED_APP: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq'
      ROLLBACK_ROOT: 'C:\SailPoint-Rollback'
      QA_URL: 'http://localhost:8080/identityiq/login.jsf'
      DOWNLOAD_PATH: '${{ github.workspace }}\downloaded-artifact'

    steps:
      - name: Show Deployment Information
        shell: powershell
        run: |
          Write-Host "QA Deployment"
          Write-Host "Machine: $env:COMPUTERNAME"
          Write-Host "Account:"
          whoami
          Write-Host "CI Run ID: $env:CI_RUN_ID"
          Write-Host "Artifact: $env:ARTIFACT_NAME"

      - name: Validate QA Prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path $env:CURRENT_WAR)) {
            throw "Current WAR not found: $env:CURRENT_WAR"
          }

          $service = Get-Service -Name $env:TOMCAT_SERVICE
          Write-Host "Tomcat status: $($service.Status)"

          $testFile = Join-Path $env:WEBAPPS_PATH "runner-test.tmp"
          Set-Content -Path $testFile -Value "test"
          Remove-Item -Path $testFile -Force

          Write-Host "QA prerequisites passed"

      - name: Prepare Download Directory
        shell: powershell
        run: |
          if (Test-Path $env:DOWNLOAD_PATH) {
            Remove-Item $env:DOWNLOAD_PATH -Recurse -Force
          }

          New-Item `
            -Path $env:DOWNLOAD_PATH `
            -ItemType Directory `
            -Force | Out-Null

      - name: Download CI Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.DOWNLOAD_PATH }}
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate WAR and Checksum
        id: artifact
        shell: powershell
        run: |
          $war = Get-ChildItem `
            -Path $env:DOWNLOAD_PATH `
            -Filter "*.war" `
            -Recurse |
            Select-Object -First 1

          $checksum = Get-ChildItem `
            -Path $env:DOWNLOAD_PATH `
            -Filter "*.war.sha256" `
            -Recurse |
            Select-Object -First 1

          if (-not $war) {
            throw "WAR not found in artifact"
          }

          if (-not $checksum) {
            throw "SHA256 file not found"
          }

          "war_path=$($war.FullName)" >> $env:GITHUB_OUTPUT
          "checksum_path=$($checksum.FullName)" >> $env:GITHUB_OUTPUT

      - name: Verify WAR SHA256
        shell: powershell
        env:
          NEW_WAR: ${{ steps.artifact.outputs.war_path }}
          CHECKSUM_FILE: ${{ steps.artifact.outputs.checksum_path }}
        run: |
          $line = (Get-Content $env:CHECKSUM_FILE -Raw).Trim()
          $expected = ($line -split "\s+")[0].ToUpper()
          $actual = (Get-FileHash $env:NEW_WAR -Algorithm SHA256).Hash.ToUpper()

          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"

          if ($expected -ne $actual) {
            throw "WAR checksum validation failed"
          }

      - name: Backup Current QA WAR
        id: rollback
        shell: powershell
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $folder = Join-Path $env:ROLLBACK_ROOT $timestamp

          New-Item `
            -Path $folder `
            -ItemType Directory `
            -Force | Out-Null

          $backup = Join-Path $folder "identityiq.war"

          Copy-Item `
            -Path $env:CURRENT_WAR `
            -Destination $backup `
            -Force

          "rollback_war=$backup" >> $env:GITHUB_OUTPUT
          "rollback_folder=$folder" >> $env:GITHUB_OUTPUT

          Write-Host "Backup created: $backup"

      - name: Stop Tomcat
        shell: powershell
        run: |
          Stop-Service `
            -Name $env:TOMCAT_SERVICE `
            -Force

          (Get-Service $env:TOMCAT_SERVICE).WaitForStatus(
            "Stopped",
            (New-TimeSpan -Seconds 60)
          )

      - name: Remove Existing Expanded IdentityIQ
        shell: powershell
        run: |
          if (Test-Path $env:EXPANDED_APP) {
            Remove-Item `
              -Path $env:EXPANDED_APP `
              -Recurse `
              -Force
          }

      - name: Deploy New WAR
        shell: powershell
        env:
          NEW_WAR: ${{ steps.artifact.outputs.war_path }}
        run: |
          Copy-Item `
            -Path $env:NEW_WAR `
            -Destination $env:CURRENT_WAR `
            -Force

          Write-Host "New IdentityIQ WAR deployed"

      - name: Start Tomcat
        shell: powershell
        run: |
          Start-Service $env:TOMCAT_SERVICE

          (Get-Service $env:TOMCAT_SERVICE).WaitForStatus(
            "Running",
            (New-TimeSpan -Seconds 90)
          )

      - name: Wait for IdentityIQ
        shell: powershell
        run: |
          Start-Sleep -Seconds 45

      - name: Smoke Test IdentityIQ
        shell: powershell
        run: |
          $success = $false

          for ($i = 1; $i -le 12; $i++) {
            try {
              $response = Invoke-WebRequest `
                -Uri $env:QA_URL `
                -UseBasicParsing `
                -TimeoutSec 20

              Write-Host "HTTP Status: $($response.StatusCode)"

              if ($response.StatusCode -eq 200) {
                $success = $true
                break
              }
            }
            catch {
              Write-Host "IdentityIQ not ready. Attempt $i"
            }

            Start-Sleep -Seconds 10
          }

          if (-not $success) {
            throw "QA smoke test failed"
          }

          Write-Host "QA deployment successful"

      - name: Rollback Previous WAR
        if: failure() && steps.rollback.outputs.rollback_war != ''
        shell: powershell
        env:
          ROLLBACK_WAR: ${{ steps.rollback.outputs.rollback_war }}
        run: |
          Write-Host "Starting rollback"

          Stop-Service `
            -Name $env:TOMCAT_SERVICE `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          if (Test-Path $env:EXPANDED_APP) {
            Remove-Item `
              -Path $env:EXPANDED_APP `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Copy-Item `
            -Path $env:ROLLBACK_WAR `
            -Destination $env:CURRENT_WAR `
            -Force

          Start-Service $env:TOMCAT_SERVICE

          Write-Host "Previous WAR restored"
