name: Deploy IdentityIQ to QA

on:
  # Manual CD deployment
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful CI workflow Run ID"
        required: true
        type: string

  # Register/test workflow after pushing changes
  push:
    branches:
      - feature/iiq85-qa-cd-pipeline

permissions:
  actions: read
  contents: read

jobs:

  # =========================================================
  # PUSH VALIDATION
  # This runs only when the YAML is pushed.
  # It does NOT deploy to QA.
  # =========================================================

  validate-cd-workflow:
    if: github.event_name == 'push'

    runs-on:
      - self-hosted
      - Windows

    steps:
      - name: CD Workflow Push Validation
        shell: powershell
        run: |
          Write-Host "CD workflow updated successfully."
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Actual QA deployment must be started manually."


  # =========================================================
  # MANUAL QA DEPLOYMENT
  # =========================================================

  deploy-to-qa:
    if: github.event_name == 'workflow_dispatch'

    name: Deploy IdentityIQ WAR to QA

    runs-on:
      - self-hosted
      - Windows

    env:
      TOMCAT_SERVICE: Tomcat9

      TOMCAT_WEBAPPS: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps'

      IIQ_WAR: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq.war'

      IIQ_EXPLODED: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq'

      DOWNLOAD_DIR: 'C:\actions-runner\_work\_deploy\iiq'

      BACKUP_DIR: 'C:\IIQ_Backup'

    steps:

      # =====================================================
      # 1. RUNNER INFORMATION
      # =====================================================

      - name: Show Runner Information
        shell: powershell
        run: |
          Write-Host "===== RUNNER IDENTITY ====="
          whoami

          Write-Host "===== USER SID ====="
          whoami /user

          Write-Host "===== TOMCAT STATUS ====="
          sc.exe query $env:TOMCAT_SERVICE


      # =====================================================
      # 2. PREPARE DOWNLOAD DIRECTORY
      # =====================================================

      - name: Prepare Download Directory
        shell: powershell
        run: |
          Write-Host "===== PREPARE DOWNLOAD DIRECTORY ====="

          if (Test-Path $env:DOWNLOAD_DIR) {
              Remove-Item `
                -Path $env:DOWNLOAD_DIR `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $env:DOWNLOAD_DIR `
            -Force | Out-Null

          Write-Host "Download directory:"
          Write-Host $env:DOWNLOAD_DIR


      # =====================================================
      # 3. DOWNLOAD CI ARTIFACT DYNAMICALLY
      # =====================================================

      - name: Download CI Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: identityiq-*
          path: ${{ env.DOWNLOAD_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}


      # =====================================================
      # 4. LOCATE WAR
      # =====================================================

      - name: Locate WAR
        shell: powershell
        run: |
          Write-Host "===== DOWNLOADED FILES ====="

          Get-ChildItem `
            -Path $env:DOWNLOAD_DIR `
            -Recurse

          $warFiles = @(
              Get-ChildItem `
                -Path $env:DOWNLOAD_DIR `
                -Recurse `
                -Filter "*.war" `
                -File
          )

          if ($warFiles.Count -eq 0) {
              throw "No WAR file found in CI artifact."
          }

          if ($warFiles.Count -gt 1) {
              Write-Host "WAR files found:"
              $warFiles.FullName | Write-Host
              throw "Multiple WAR files found. Deployment stopped to avoid deploying the wrong WAR."
          }

          $war = $warFiles[0]

          Write-Host "WAR located:"
          Write-Host $war.FullName

          "WAR_PATH=$($war.FullName)" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # =====================================================
      # 5. CALCULATE SOURCE WAR SHA256
      # =====================================================

      - name: Calculate Downloaded WAR SHA256
        shell: powershell
        run: |
          Write-Host "===== SOURCE WAR SHA256 ====="

          $hash = Get-FileHash `
            -Path $env:WAR_PATH `
            -Algorithm SHA256

          Write-Host "WAR:"
          Write-Host $hash.Path

          Write-Host "SHA256:"
          Write-Host $hash.Hash

          "SOURCE_WAR_HASH=$($hash.Hash)" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # =====================================================
      # 6. PREPARE ROLLBACK DIRECTORY
      # =====================================================

      - name: Prepare Rollback Directory
        shell: powershell
        run: |
          Write-Host "===== PREPARE ROLLBACK DIRECTORY ====="

          if (-not (Test-Path $env:BACKUP_DIR)) {

              New-Item `
                -ItemType Directory `
                -Path $env:BACKUP_DIR `
                -Force | Out-Null

          }

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          $backup = Join-Path `
            $env:BACKUP_DIR `
            "deployment-$timestamp"

          New-Item `
            -ItemType Directory `
            -Path $backup `
            -Force | Out-Null

          "CURRENT_BACKUP=$backup" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "Rollback location:"
          Write-Host $backup


      # =====================================================
      # 7. BACKUP CURRENT QA WAR
      # =====================================================

      - name: Backup Current QA WAR
        shell: powershell
        run: |
          Write-Host "===== BACKUP CURRENT QA WAR ====="

          if (Test-Path $env:IIQ_WAR) {

              $backupWar = Join-Path `
                $env:CURRENT_BACKUP `
                "identityiq.war"

              Copy-Item `
                -Path $env:IIQ_WAR `
                -Destination $backupWar `
                -Force

              if (-not (Test-Path $backupWar)) {
                  throw "Existing QA WAR backup failed."
              }

              Write-Host "Current QA WAR backed up successfully."
              Write-Host $backupWar

          }
          else {

              Write-Host "No existing identityiq.war found."
              Write-Host "Deployment will continue."

          }


      # =====================================================
      # 8. STOP TOMCAT
      # Tested successfully with a 180-second timeout
      # =====================================================

      - name: Stop Tomcat
        shell: powershell
        run: |
          Write-Host "===== TOMCAT CURRENT STATUS ====="

          $status = sc.exe query $env:TOMCAT_SERVICE
          $status | Write-Host

          if ($status -match "STOPPED") {

              Write-Host "Tomcat is already STOPPED."

          }
          else {

              Write-Host "===== STOPPING TOMCAT ====="

              sc.exe stop $env:TOMCAT_SERVICE

              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to send stop command to Tomcat."
              }

              Write-Host "Waiting for Tomcat to stop..."

              $timeout = 180
              $elapsed = 0
              $stopped = $false

              while ($elapsed -lt $timeout) {

                  Start-Sleep -Seconds 5

                  $output = sc.exe query $env:TOMCAT_SERVICE
                  $output | Write-Host

                  if ($output -match "STOPPED") {

                      $stopped = $true

                      Write-Host "Tomcat stopped successfully."
                      break

                  }

                  $elapsed += 5
              }

              if (-not $stopped) {
                  throw "Tomcat did not stop within 180 seconds."
              }

          }


      # =====================================================
      # 9. REMOVE OLD EXPANDED IDENTITYIQ
      # =====================================================

      - name: Remove Existing Expanded IdentityIQ
        shell: powershell
        run: |
          Write-Host "===== REMOVE EXPANDED IDENTITYIQ ====="

          if (Test-Path $env:IIQ_EXPLODED) {

              Remove-Item `
                -Path $env:IIQ_EXPLODED `
                -Recurse `
                -Force

              Write-Host "Old expanded IdentityIQ directory removed."

          }
          else {

              Write-Host "Expanded IdentityIQ directory is not present."

          }


      # =====================================================
      # 10. REMOVE OLD WAR
      # =====================================================

      - name: Remove Existing QA WAR
        shell: powershell
        run: |
          Write-Host "===== REMOVE EXISTING QA WAR ====="

          if (Test-Path $env:IIQ_WAR) {

              Remove-Item `
                -Path $env:IIQ_WAR `
                -Force

              Write-Host "Existing QA WAR removed."

          }
          else {

              Write-Host "Existing QA WAR is not present."

          }


      # =====================================================
      # 11. COPY NEW WAR
      # =====================================================

      - name: Deploy New IdentityIQ WAR
        shell: powershell
        run: |
          Write-Host "===== DEPLOY NEW WAR ====="

          Write-Host "Source:"
          Write-Host $env:WAR_PATH

          Write-Host "Destination:"
          Write-Host $env:IIQ_WAR

          Copy-Item `
            -Path $env:WAR_PATH `
            -Destination $env:IIQ_WAR `
            -Force

          if (-not (Test-Path $env:IIQ_WAR)) {
              throw "New IdentityIQ WAR was not deployed."
          }

          Write-Host "New IdentityIQ WAR deployed successfully."


      # =====================================================
      # 12. VERIFY DEPLOYED WAR SHA256
      # =====================================================

      - name: Verify Deployed WAR
        shell: powershell
        run: |
          Write-Host "===== VERIFY DEPLOYED WAR ====="

          if (-not (Test-Path $env:IIQ_WAR)) {
              throw "Deployed WAR does not exist."
          }

          $deployedHash = Get-FileHash `
            -Path $env:IIQ_WAR `
            -Algorithm SHA256

          Write-Host "Source SHA256:"
          Write-Host $env:SOURCE_WAR_HASH

          Write-Host "Deployed SHA256:"
          Write-Host $deployedHash.Hash

          if ($deployedHash.Hash -ne $env:SOURCE_WAR_HASH) {
              throw "WAR SHA256 verification failed after deployment."
          }

          Write-Host "WAR SHA256 verification successful."


      # =====================================================
      # 13. START TOMCAT
      # =====================================================

      - name: Start Tomcat
        shell: powershell
        run: |
          Write-Host "===== TOMCAT STATUS BEFORE START ====="

          $status = sc.exe query $env:TOMCAT_SERVICE
          $status | Write-Host

          if ($status -match "RUNNING") {

              Write-Host "Tomcat is already RUNNING."

          }
          else {

              Write-Host "===== STARTING TOMCAT ====="

              sc.exe start $env:TOMCAT_SERVICE

              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to start Tomcat."
              }

          }


      # =====================================================
      # 14. WAIT FOR TOMCAT
      # =====================================================

      - name: Wait for Tomcat to Start
        shell: powershell
        run: |
          Write-Host "===== WAIT FOR TOMCAT ====="

          $timeout = 180
          $elapsed = 0
          $running = $false

          while ($elapsed -lt $timeout) {

              Start-Sleep -Seconds 5

              $output = sc.exe query $env:TOMCAT_SERVICE
              $output | Write-Host

              if ($output -match "RUNNING") {

                  $running = $true

                  Write-Host "Tomcat is RUNNING."
                  break

              }

              $elapsed += 5
          }

          if (-not $running) {
              throw "Tomcat did not reach RUNNING state within 180 seconds."
          }


      # =====================================================
      # 15. FINAL DEPLOYMENT VERIFICATION
      # =====================================================

      - name: Final Deployment Verification
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "       IDENTITYIQ QA DEPLOYMENT"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "CI Run ID:"
          Write-Host "${{ inputs.run_id }}"

          Write-Host ""
          Write-Host "Tomcat Status:"
          sc.exe query $env:TOMCAT_SERVICE

          Write-Host ""
          Write-Host "Deployed WAR:"
          Get-Item $env:IIQ_WAR

          Write-Host ""
          Write-Host "Deployed WAR SHA256:"
          Get-FileHash `
            -Path $env:IIQ_WAR `
            -Algorithm SHA256

          Write-Host ""
          Write-Host "Rollback backup:"
          Write-Host $env:CURRENT_BACKUP

          Write-Host ""
          Write-Host "QA deployment completed successfully."
