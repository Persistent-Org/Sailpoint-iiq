name: Deploy IdentityIQ to QA

on:
  # CD starts when an approved PR is merged into develop.
  # CI also starts from the same develop push.
  push:
    branches:
      - develop

permissions:
  actions: read
  contents: read

concurrency:
  group: identityiq-qa-deployment
  cancel-in-progress: false

jobs:

  deploy-to-qa:
    name: Deploy IdentityIQ WAR to QA

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 90

    env:
      CI_WORKFLOW_NAME: 'CI - Build & Validate (SailPoint IIQ)'
      TOMCAT_SERVICE: 'Tomcat9'

      IIQ_WAR: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq.war'
      IIQ_EXPLODED: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq'
      IIQ_BIN: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq\WEB-INF\bin'
      IIQ_IMPORT_FILE: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq\WEB-INF\config\sp.init-custom.xml'

      DOWNLOAD_DIR: 'C:\actions-runner\_work\_deploy\iiq'
      BACKUP_DIR: 'C:\IIQ_Backup'

    steps:

      # =====================================================
      # 1. SHOW RUNNER AND DEPLOYMENT INFORMATION
      # =====================================================
      - name: Show Runner Information
        shell: powershell
        run: |
          Write-Host "===== DEPLOYMENT INFORMATION ====="
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Commit: $env:GITHUB_SHA"
          Write-Host "CD Run ID: $env:GITHUB_RUN_ID"

          Write-Host ""
          Write-Host "===== RUNNER IDENTITY ====="

          hostname
          whoami
          whoami /user

          Write-Host ""
          Write-Host "===== TOMCAT STATUS ====="

          sc.exe query $env:TOMCAT_SERVICE

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to query the Tomcat service."
          }


      # =====================================================
      # 2. WAIT FOR CI RUN FOR SAME COMMIT
      # =====================================================
      - name: Wait for Successful CI Run
        id: find-ci
        uses: actions/github-script@v7
        env:
          CI_WORKFLOW_NAME: ${{ env.CI_WORKFLOW_NAME }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const workflowName = process.env.CI_WORKFLOW_NAME;
            const targetSha = process.env.TARGET_SHA;
            const targetBranch = process.env.TARGET_BRANCH;

            const timeoutMinutes = 60;
            const pollSeconds = 20;
            const startTime = Date.now();

            core.info(`CI workflow: ${workflowName}`);
            core.info(`Target branch: ${targetBranch}`);
            core.info(`Target commit: ${targetSha}`);

            while (
              Date.now() - startTime <
              timeoutMinutes * 60 * 1000
            ) {
              const response =
                await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: targetBranch,
                  per_page: 100
                });

              const ciRun =
                response.data.workflow_runs.find(run =>
                  run.name === workflowName &&
                  run.head_sha === targetSha
                );

              if (!ciRun) {
                core.info(
                  `CI run not found yet. Waiting ${pollSeconds} seconds.`
                );

                await new Promise(resolve =>
                  setTimeout(resolve, pollSeconds * 1000)
                );

                continue;
              }

              core.info(`CI Run ID: ${ciRun.id}`);
              core.info(`CI status: ${ciRun.status}`);
              core.info(`CI conclusion: ${ciRun.conclusion}`);

              if (ciRun.status !== "completed") {
                core.info(
                  `CI is still running. Waiting ${pollSeconds} seconds.`
                );

                await new Promise(resolve =>
                  setTimeout(resolve, pollSeconds * 1000)
                );

                continue;
              }

              if (ciRun.conclusion !== "success") {
                core.setFailed(
                  `CI Run ${ciRun.id} completed with conclusion: ${ciRun.conclusion}`
                );
                return;
              }

              core.setOutput(
                "run_id",
                ciRun.id.toString()
              );

              core.info(
                `Successful CI Run ID selected: ${ciRun.id}`
              );

              return;
            }

            core.setFailed(
              `CI did not complete successfully within ${timeoutMinutes} minutes.`
            );


      # =====================================================
      # 3. VALIDATE SELECTED CI RUN
      # =====================================================
      - name: Validate Selected CI Run
        shell: powershell
        env:
          CI_RUN_ID: ${{ steps.find-ci.outputs.run_id }}

        run: |
          Write-Host "===== SELECTED CI RUN ====="
          Write-Host "CI Workflow: $env:CI_WORKFLOW_NAME"
          Write-Host "CI Run ID: $env:CI_RUN_ID"
          Write-Host "Commit: $env:GITHUB_SHA"

          if (-not $env:CI_RUN_ID) {
              throw "CI Run ID was not found."
          }


      # =====================================================
      # 4. PREPARE DOWNLOAD DIRECTORY
      # =====================================================
      - name: Prepare Download Directory
        shell: powershell
        run: |
          Write-Host "===== PREPARE DOWNLOAD DIRECTORY ====="

          if (Test-Path $env:DOWNLOAD_DIR) {
              Remove-Item `
                -Path $env:DOWNLOAD_DIR `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $env:DOWNLOAD_DIR `
            -Force |
            Out-Null

          if (-not (Test-Path $env:DOWNLOAD_DIR)) {
              throw "Download directory could not be created."
          }

          Write-Host "Download directory:"
          Write-Host $env:DOWNLOAD_DIR


      # =====================================================
      # 5. DOWNLOAD ARTIFACT FROM SUCCESSFUL CI RUN
      # =====================================================
      - name: Download CI Artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.find-ci.outputs.run_id }}
          pattern: identityiq-*
          path: ${{ env.DOWNLOAD_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}


      # =====================================================
      # 6. LOCATE WAR
      # =====================================================
      - name: Locate WAR
        shell: powershell
        run: |
          Write-Host "===== DOWNLOADED FILES ====="

          Get-ChildItem `
            -Path $env:DOWNLOAD_DIR `
            -Recurse |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          $warFiles = @(
              Get-ChildItem `
                -Path $env:DOWNLOAD_DIR `
                -Recurse `
                -Filter "*.war" `
                -File
          )

          if ($warFiles.Count -eq 0) {
              throw "No WAR file found in the identityiq-* artifact."
          }

          if ($warFiles.Count -gt 1) {
              Write-Host "Multiple WAR files found:"

              $warFiles |
                Select-Object FullName, Length |
                Format-Table -AutoSize

              throw "Multiple WAR files found. Deployment stopped."
          }

          $war = $warFiles[0]

          if ($war.Length -le 0) {
              throw "Downloaded WAR is empty."
          }

          Write-Host "WAR path:"
          Write-Host $war.FullName

          Write-Host "WAR size:"
          Write-Host $war.Length

          "WAR_PATH=$($war.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # =====================================================
      # 7. CALCULATE SOURCE WAR SHA256
      # =====================================================
      - name: Calculate Downloaded WAR SHA256
        shell: powershell
        run: |
          Write-Host "===== SOURCE WAR SHA256 ====="

          if (-not (Test-Path $env:WAR_PATH)) {
              throw "Downloaded WAR does not exist."
          }

          $sourceHash = Get-FileHash `
            -Path $env:WAR_PATH `
            -Algorithm SHA256

          Write-Host "Source WAR:"
          Write-Host $sourceHash.Path

          Write-Host "Source SHA256:"
          Write-Host $sourceHash.Hash

          "SOURCE_WAR_HASH=$($sourceHash.Hash)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # =====================================================
      # 8. PREPARE ROLLBACK DIRECTORY
      # =====================================================
      - name: Prepare Rollback Directory
        shell: powershell
        run: |
          Write-Host "===== PREPARE ROLLBACK DIRECTORY ====="

          if (-not (Test-Path $env:BACKUP_DIR)) {
              New-Item `
                -ItemType Directory `
                -Path $env:BACKUP_DIR `
                -Force |
                Out-Null
          }

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          $backup = Join-Path `
            -Path $env:BACKUP_DIR `
            -ChildPath "deployment-$timestamp"

          New-Item `
            -ItemType Directory `
            -Path $backup `
            -Force |
            Out-Null

          if (-not (Test-Path $backup)) {
              throw "Rollback directory could not be created."
          }

          "CURRENT_BACKUP=$backup" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Rollback directory:"
          Write-Host $backup


      # =====================================================
      # 9. BACKUP EXISTING QA WAR
      # =====================================================
      - name: Backup Current QA WAR
        shell: powershell
        run: |
          Write-Host "===== BACKUP CURRENT QA WAR ====="

          if (Test-Path $env:IIQ_WAR) {
              $backupWar = Join-Path `
                -Path $env:CURRENT_BACKUP `
                -ChildPath "identityiq.war"

              Copy-Item `
                -Path $env:IIQ_WAR `
                -Destination $backupWar `
                -Force

              if (-not (Test-Path $backupWar)) {
                  throw "Existing QA WAR backup failed."
              }

              Write-Host "Current QA WAR backed up:"
              Write-Host $backupWar

              Write-Host "Backup SHA256:"

              Get-FileHash `
                -Path $backupWar `
                -Algorithm SHA256
          }
          else {
              Write-Host "No existing identityiq.war found."
              Write-Host "Deployment will continue."
          }


      # =====================================================
      # 10. STOP TOMCAT
      # =====================================================
      - name: Stop Tomcat
        shell: powershell
        run: |
          Write-Host "===== TOMCAT STATUS BEFORE STOP ====="

          $status = sc.exe query $env:TOMCAT_SERVICE
          $status | Write-Host

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to query Tomcat."
          }

          if ($status -match "STOPPED") {
              Write-Host "Tomcat is already STOPPED."
          }
          else {
              Write-Host "===== STOPPING TOMCAT ====="

              sc.exe stop $env:TOMCAT_SERVICE

              if (
                  $LASTEXITCODE -ne 0 -and
                  $LASTEXITCODE -ne 1062
              ) {
                  throw "Unable to send the stop command to Tomcat."
              }

              $timeout = 180
              $elapsed = 0
              $stopped = $false

              while ($elapsed -lt $timeout) {
                  Start-Sleep -Seconds 5
                  $elapsed += 5

                  $output = sc.exe query $env:TOMCAT_SERVICE
                  $output | Write-Host

                  if ($output -match "STOPPED") {
                      $stopped = $true
                      Write-Host "Tomcat stopped successfully."
                      break
                  }
              }

              if (-not $stopped) {
                  throw "Tomcat did not stop within 180 seconds."
              }
          }


      # =====================================================
      # 11. REMOVE EXISTING EXPANDED IDENTITYIQ
      # =====================================================
      - name: Remove Existing Expanded IdentityIQ
        shell: powershell
        run: |
          Write-Host "===== REMOVE EXPANDED IDENTITYIQ ====="

          if (Test-Path $env:IIQ_EXPLODED) {
              Remove-Item `
                -Path $env:IIQ_EXPLODED `
                -Recurse `
                -Force

              if (Test-Path $env:IIQ_EXPLODED) {
                  throw "Expanded IdentityIQ directory could not be removed."
              }

              Write-Host "Expanded IdentityIQ directory removed."
          }
          else {
              Write-Host "Expanded IdentityIQ directory does not exist."
          }


      # =====================================================
      # 12. REMOVE OLD QA WAR
      # =====================================================
      - name: Remove Existing QA WAR
        shell: powershell
        run: |
          Write-Host "===== REMOVE EXISTING QA WAR ====="

          if (Test-Path $env:IIQ_WAR) {
              Remove-Item `
                -Path $env:IIQ_WAR `
                -Force

              if (Test-Path $env:IIQ_WAR) {
                  throw "Existing QA WAR could not be removed."
              }

              Write-Host "Existing QA WAR removed."
          }
          else {
              Write-Host "Existing QA WAR is not present."
          }


      # =====================================================
      # 13. DEPLOY NEW WAR
      # =====================================================
      - name: Deploy New IdentityIQ WAR
        shell: powershell
        run: |
          Write-Host "===== DEPLOY NEW WAR ====="

          Write-Host "Source:"
          Write-Host $env:WAR_PATH

          Write-Host "Destination:"
          Write-Host $env:IIQ_WAR

          Copy-Item `
            -Path $env:WAR_PATH `
            -Destination $env:IIQ_WAR `
            -Force

          if (-not (Test-Path $env:IIQ_WAR)) {
              throw "New IdentityIQ WAR was not deployed."
          }

          $deployedWar = Get-Item $env:IIQ_WAR

          if ($deployedWar.Length -le 0) {
              throw "Deployed WAR is empty."
          }

          Write-Host "WAR deployed successfully."

          Write-Host "Deployed WAR size:"
          Write-Host $deployedWar.Length


      # =====================================================
      # 14. VERIFY DEPLOYED WAR SHA256
      # =====================================================
      - name: Verify Deployed WAR SHA256
        shell: powershell
        run: |
          Write-Host "===== VERIFY DEPLOYED WAR ====="

          $deployedHash = Get-FileHash `
            -Path $env:IIQ_WAR `
            -Algorithm SHA256

          Write-Host "Source SHA256:"
          Write-Host $env:SOURCE_WAR_HASH

          Write-Host "Deployed SHA256:"
          Write-Host $deployedHash.Hash

          if ($deployedHash.Hash -ne $env:SOURCE_WAR_HASH) {
              throw "WAR SHA256 verification failed."
          }

          Write-Host "WAR SHA256 verification successful."


      # =====================================================
      # 15. START TOMCAT
      # =====================================================
      - name: Start Tomcat
        shell: powershell
        run: |
          Write-Host "===== TOMCAT STATUS BEFORE START ====="

          $status = sc.exe query $env:TOMCAT_SERVICE
          $status | Write-Host

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to query Tomcat."
          }

          if ($status -match "RUNNING") {
              Write-Host "Tomcat is already RUNNING."
          }
          else {
              Write-Host "===== STARTING TOMCAT ====="

              sc.exe start $env:TOMCAT_SERVICE

              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to start Tomcat."
              }
          }


      # =====================================================
      # 16. WAIT FOR TOMCAT TO START
      # =====================================================
      - name: Wait for Tomcat to Start
        shell: powershell
        run: |
          Write-Host "===== WAIT FOR TOMCAT ====="

          $timeout = 180
          $elapsed = 0
          $running = $false

          while ($elapsed -lt $timeout) {
              Start-Sleep -Seconds 5
              $elapsed += 5

              $output = sc.exe query $env:TOMCAT_SERVICE
              $output | Write-Host

              if ($output -match "RUNNING") {
                  $running = $true
                  Write-Host "Tomcat is RUNNING."
                  break
              }
          }

          if (-not $running) {
              throw "Tomcat did not reach RUNNING state within 180 seconds."
          }


      # =====================================================
      # 17. WAIT FOR IDENTITYIQ TO EXPAND
      # =====================================================
      - name: Wait for IdentityIQ Deployment
        shell: powershell
        run: |
          Write-Host "===== WAIT FOR IDENTITYIQ EXPANSION ====="

          $timeout = 300
          $elapsed = 0
          $expanded = $false

          while ($elapsed -lt $timeout) {
              if (
                  (Test-Path $env:IIQ_EXPLODED -PathType Container) -and
                  (Test-Path $env:IIQ_BIN -PathType Container)
              ) {
                  $expanded = $true
                  Write-Host "IdentityIQ expanded directory exists."
                  Write-Host "IdentityIQ bin directory exists."
                  break
              }

              Start-Sleep -Seconds 10
              $elapsed += 10
          }

          if (-not $expanded) {
              throw "IdentityIQ was not fully expanded within 300 seconds."
          }


      # =====================================================
      # 18. VALIDATE IIQ CONSOLE AND IMPORT FILE
      # =====================================================
      - name: Validate IIQ Console and Import File
        shell: powershell
        run: |
          Write-Host "===== VALIDATE IIQ CONSOLE ====="

          if (-not (Test-Path $env:IIQ_BIN -PathType Container)) {
              throw "IdentityIQ bin directory does not exist: $env:IIQ_BIN"
          }

          $resolvedImportFile = $env:IIQ_IMPORT_FILE

          if (-not (Test-Path $resolvedImportFile -PathType Leaf)) {
              Write-Host "Configured import file was not found:"
              Write-Host $resolvedImportFile

              Write-Host ""
              Write-Host "Searching the deployed IdentityIQ directory..."

              $matches = @(
                  Get-ChildItem `
                    -Path $env:IIQ_EXPLODED `
                    -Recurse `
                    -Filter "sp.init-custom.xml" `
                    -File `
                    -ErrorAction SilentlyContinue
              )

              if ($matches.Count -eq 0) {
                  throw "sp.init-custom.xml was not found in the deployed IdentityIQ directory."
              }

              if ($matches.Count -gt 1) {
                  Write-Host "Multiple sp.init-custom.xml files were found:"

                  $matches |
                    Select-Object FullName, Length, LastWriteTime |
                    Format-Table -AutoSize

                  throw "Multiple sp.init-custom.xml files were found. Configure IIQ_IMPORT_FILE with the required file."
              }

              $resolvedImportFile = $matches[0].FullName
          }

          $launcherCandidates = @(
              (Join-Path $env:IIQ_BIN "iiq.bat"),
              (Join-Path $env:IIQ_BIN "iiq.cmd"),
              (Join-Path $env:IIQ_BIN "iiq.exe")
          )

          $launcher = $launcherCandidates |
            Where-Object {
                Test-Path $_ -PathType Leaf
            } |
            Select-Object -First 1

          if (-not $launcher) {
              Write-Host "Files available in the IIQ bin directory:"

              Get-ChildItem `
                -Path $env:IIQ_BIN `
                -File |
                Select-Object Name, FullName |
                Format-Table -AutoSize

              throw "No supported IdentityIQ console launcher was found."
          }

          "IIQ_LAUNCHER=$launcher" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "IIQ_IMPORT_FILE=$resolvedImportFile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "IdentityIQ console launcher:"
          Write-Host $launcher

          Write-Host ""
          Write-Host "IdentityIQ import file:"
          Write-Host $resolvedImportFile


      # =====================================================
      # 19. PREPARE IIQ CONSOLE COMMAND FILE
      # =====================================================
      - name: Prepare IIQ Console Import Commands
        shell: powershell
        run: |
          Write-Host "===== PREPARE IIQ IMPORT COMMANDS ====="

          if (-not $env:IIQ_LAUNCHER) {
              throw "IIQ_LAUNCHER was not set."
          }

          if (-not (Test-Path $env:IIQ_LAUNCHER -PathType Leaf)) {
              throw "IIQ launcher does not exist: $env:IIQ_LAUNCHER"
          }

          if (-not (Test-Path $env:IIQ_IMPORT_FILE -PathType Leaf)) {
              throw "IIQ import file does not exist: $env:IIQ_IMPORT_FILE"
          }

          $commandFile = Join-Path `
            -Path $env:RUNNER_TEMP `
            -ChildPath "iiq-import-$env:GITHUB_RUN_ID.txt"

          $logFile = Join-Path `
            -Path $env:RUNNER_TEMP `
            -ChildPath "iiq-import-$env:GITHUB_RUN_ID.log"

          $importCommand = 'import "' + $env:IIQ_IMPORT_FILE + '"'

          @(
              $importCommand
              "exit"
          ) |
            Set-Content `
              -Path $commandFile `
              -Encoding ASCII

          if (-not (Test-Path $commandFile -PathType Leaf)) {
              throw "IIQ console command file could not be created."
          }

          "IIQ_COMMAND_FILE=$commandFile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "IIQ_IMPORT_LOG=$logFile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "IIQ command file created:"
          Write-Host $commandFile

          Write-Host ""
          Write-Host "Commands that will be executed:"

          Get-Content $commandFile


      # =====================================================
      # 20. IMPORT IIQ CONFIGURATIONS
      # =====================================================
      - name: Import IIQ Configurations
        shell: powershell
        run: |
          Write-Host "===== IMPORT IIQ CONFIGURATIONS ====="

          if (-not (Test-Path $env:IIQ_LAUNCHER -PathType Leaf)) {
              throw "IIQ console launcher does not exist: $env:IIQ_LAUNCHER"
          }

          if (-not (Test-Path $env:IIQ_COMMAND_FILE -PathType Leaf)) {
              throw "IIQ command file does not exist: $env:IIQ_COMMAND_FILE"
          }

          if (-not (Test-Path $env:IIQ_IMPORT_FILE -PathType Leaf)) {
              throw "IIQ import file does not exist: $env:IIQ_IMPORT_FILE"
          }

          Set-Location $env:IIQ_BIN

          Write-Host "Working directory:"
          Write-Host (Get-Location).Path

          Write-Host ""
          Write-Host "Console launcher:"
          Write-Host $env:IIQ_LAUNCHER

          Write-Host ""
          Write-Host "Import file:"
          Write-Host $env:IIQ_IMPORT_FILE

          Write-Host ""
          Write-Host "Starting IIQ console import..."

          $consoleCommand =
              "`"$env:IIQ_LAUNCHER`" console " +
              "< `"$env:IIQ_COMMAND_FILE`" " +
              "> `"$env:IIQ_IMPORT_LOG`" 2>&1"

          & cmd.exe /d /s /c $consoleCommand

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "===== IIQ CONSOLE OUTPUT ====="

          if (Test-Path $env:IIQ_IMPORT_LOG -PathType Leaf) {
              Get-Content `
                -Path $env:IIQ_IMPORT_LOG `
                -ErrorAction Stop
          }
          else {
              throw "IIQ console did not generate an import log."
          }

          Write-Host ""
          Write-Host "IIQ console exit code: $exitCode"

          if ($exitCode -ne 0) {
              throw "IdentityIQ configuration import failed with exit code $exitCode."
          }

          $failurePatterns = @(
              "Exception",
              "Import failed",
              "Unable to import",
              "FileNotFoundException",
              "BeanShell.*Error",
              "GeneralException"
          )

          $failureMatches = Select-String `
            -Path $env:IIQ_IMPORT_LOG `
            -Pattern $failurePatterns `
            -CaseSensitive:$false `
            -ErrorAction SilentlyContinue

          if ($failureMatches) {
              Write-Host ""
              Write-Host "Possible import errors were found:"

              $failureMatches |
                ForEach-Object {
                    Write-Host $_.Line
                }

              throw "IdentityIQ configuration import output contains an error."
          }

          "IIQ_IMPORT_STATUS=SUCCESS" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "IdentityIQ configuration import completed successfully."


      # =====================================================
      # 21. CLEAN TEMPORARY IIQ COMMAND FILE
      # =====================================================
      - name: Clean Temporary IIQ Command File
        if: always()
        shell: powershell
        run: |
          Write-Host "===== CLEAN TEMPORARY IIQ FILES ====="

          if (
              $env:IIQ_COMMAND_FILE -and
              (Test-Path $env:IIQ_COMMAND_FILE)
          ) {
              Remove-Item `
                -Path $env:IIQ_COMMAND_FILE `
                -Force

              Write-Host "Temporary IIQ command file removed."
          }

          if (
              $env:IIQ_IMPORT_LOG -and
              (Test-Path $env:IIQ_IMPORT_LOG)
          ) {
              Write-Host "IIQ import log:"
              Write-Host $env:IIQ_IMPORT_LOG
          }


      # =====================================================
      # 22. FINAL DEPLOYMENT VERIFICATION
      # =====================================================
      - name: Final Deployment Verification
        shell: powershell
        env:
          CI_RUN_ID: ${{ steps.find-ci.outputs.run_id }}

        run: |
          Write-Host "======================================"
          Write-Host "    IDENTITYIQ QA DEPLOYMENT"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Branch:"
          Write-Host $env:GITHUB_REF_NAME

          Write-Host ""
          Write-Host "Commit:"
          Write-Host $env:GITHUB_SHA

          Write-Host ""
          Write-Host "CI Workflow:"
          Write-Host $env:CI_WORKFLOW_NAME

          Write-Host ""
          Write-Host "CI Run ID:"
          Write-Host $env:CI_RUN_ID

          Write-Host ""
          Write-Host "Tomcat Status:"

          $tomcatStatus = sc.exe query $env:TOMCAT_SERVICE
          $tomcatStatus | Write-Host

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to query Tomcat during final verification."
          }

          if ($tomcatStatus -notmatch "RUNNING") {
              throw "Tomcat is not RUNNING after deployment."
          }

          Write-Host ""
          Write-Host "Deployed WAR:"

          Get-Item $env:IIQ_WAR |
            Format-List FullName, Length, LastWriteTime

          Write-Host ""
          Write-Host "Deployed WAR SHA256:"

          Get-FileHash `
            -Path $env:IIQ_WAR `
            -Algorithm SHA256

          Write-Host ""
          Write-Host "IdentityIQ expanded directory:"

          Get-Item $env:IIQ_EXPLODED |
            Format-List FullName, LastWriteTime

          Write-Host ""
          Write-Host "IIQ console launcher:"
          Write-Host $env:IIQ_LAUNCHER

          Write-Host ""
          Write-Host "IIQ configuration file:"
          Write-Host $env:IIQ_IMPORT_FILE

          Write-Host ""
          Write-Host "IIQ configuration import status:"
          Write-Host $env:IIQ_IMPORT_STATUS

          if ($env:IIQ_IMPORT_STATUS -ne "SUCCESS") {
              throw "IIQ configuration import was not completed successfully."
          }

          Write-Host ""
          Write-Host "Rollback directory:"
          Write-Host $env:CURRENT_BACKUP

          Write-Host ""
          Write-Host "QA deployment and IIQ configuration import completed successfully."

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value @"
          ## IdentityIQ QA Deployment

          - Branch: $env:GITHUB_REF_NAME
          - Commit: $env:GITHUB_SHA
          - CI run: $env:CI_RUN_ID
          - WAR verification: Successful
          - Tomcat status: Running
          - IdentityIQ expansion: Successful
          - Configuration import: $env:IIQ_IMPORT_STATUS
          - Rollback location: $env:CURRENT_BACKUP
          "@
