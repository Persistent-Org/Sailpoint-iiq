name: Deploy IdentityIQ to QA

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI workflow run ID containing the WAR artifact"
        required: true
        type: string

  push:
    branches:
      - feature/iiq85-qa-cd-pipeline

permissions:
  actions: read
  contents: read

jobs:
  deploy-to-qa:
    name: Deploy IdentityIQ WAR to QA
    runs-on:
      - self-hosted
      - Windows

    env:
      TOMCAT_SERVICE: Tomcat9
      TOMCAT_WEBAPPS: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps'
      IIQ_WAR: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq.war'
      IIQ_EXPLODED: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq'
      DOWNLOAD_DIR: 'C:\actions-runner\_work\_deploy\iiq'
      BACKUP_DIR: 'C:\IIQ_Backup'

    steps:

      # ============================================================
      # 1. Runner information
      # ============================================================

      - name: Show Runner Information
        shell: powershell
        run: |
          Write-Host "===== RUNNER ====="
          hostname
          whoami

          Write-Host "===== USER SID ====="
          whoami /user

          Write-Host "===== TOMCAT STATUS ====="
          sc.exe query $env:TOMCAT_SERVICE


      # ============================================================
      # 2. Prepare download directory
      # ============================================================

      - name: Prepare Download Directory
        shell: powershell
        run: |
          if (Test-Path $env:DOWNLOAD_DIR) {
              Remove-Item $env:DOWNLOAD_DIR -Recurse -Force
          }

          New-Item -ItemType Directory `
                  -Path $env:DOWNLOAD_DIR `
                  -Force | Out-Null

          Write-Host "Download directory:"
          Write-Host $env:DOWNLOAD_DIR


      # ============================================================
      # 3. Download WAR from CI
      # ============================================================

      - name: Download CI Artifact
        uses: actions/download-artifact@v4
        with:
          name: identityiq-war
          path: ${{ env.DOWNLOAD_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}


      # ============================================================
      # 4. Locate WAR and checksum
      # ============================================================

      - name: Locate WAR and Checksum
        shell: powershell
        run: |
          Write-Host "===== DOWNLOADED FILES ====="

          Get-ChildItem $env:DOWNLOAD_DIR -Recurse

          $war = Get-ChildItem `
                 $env:DOWNLOAD_DIR `
                 -Recurse `
                 -Filter "*.war" |
                 Select-Object -First 1

          if (-not $war) {
              throw "No WAR file found in downloaded CI artifact."
          }

          Write-Host "WAR found:"
          Write-Host $war.FullName

          "WAR_PATH=$($war.FullName)" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 5. Verify WAR SHA256
      # ============================================================

      - name: Verify WAR SHA256
        shell: powershell
        run: |
          Write-Host "===== WAR SHA256 ====="

          $hash = Get-FileHash `
                  -Path $env:WAR_PATH `
                  -Algorithm SHA256

          Write-Host "File:"
          Write-Host $hash.Path

          Write-Host "SHA256:"
          Write-Host $hash.Hash


      # ============================================================
      # 6. Create rollback directory
      # ============================================================

      - name: Prepare Rollback Directory
        shell: powershell
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          $backup = Join-Path `
                    $env:BACKUP_DIR `
                    "deployment-$timestamp"

          New-Item `
              -ItemType Directory `
              -Path $backup `
              -Force |
              Out-Null

          "CURRENT_BACKUP=$backup" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Rollback directory:"
          Write-Host $backup


      # ============================================================
      # 7. Backup current QA WAR
      # ============================================================

      - name: Backup Current QA WAR
        shell: powershell
        run: |
          Write-Host "===== BACKUP CURRENT QA WAR ====="

          if (Test-Path $env:IIQ_WAR) {

              Copy-Item `
                  -Path $env:IIQ_WAR `
                  -Destination $env:CURRENT_BACKUP `
                  -Force

              Write-Host "Current identityiq.war backed up."
              Write-Host "Backup location:"
              Write-Host $env:CURRENT_BACKUP

          }
          else {

              Write-Host "No existing identityiq.war found."
              Write-Host "Continuing deployment."

          }


      # ============================================================
      # 8. Stop Tomcat
      # ============================================================

      - name: Stop Tomcat
        shell: powershell
        run: |
          Write-Host "===== CURRENT TOMCAT STATUS ====="

          $status = sc.exe query $env:TOMCAT_SERVICE
          $status | Write-Host

          if ($status -match "STOPPED") {

              Write-Host "Tomcat is already stopped."

          }
          else {

              Write-Host "===== STOPPING TOMCAT ====="

              sc.exe stop $env:TOMCAT_SERVICE

              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to send stop command to Tomcat."
              }

              Write-Host "Waiting for Tomcat to stop..."

              $timeout = 180
              $elapsed = 0

              while ($elapsed -lt $timeout) {

                  $output = sc.exe query $env:TOMCAT_SERVICE
                  $output | Write-Host

                  if ($output -match "STOPPED") {

                      Write-Host "Tomcat stopped successfully."
                      break

                  }

                  Start-Sleep -Seconds 5

                  $elapsed += 5
              }

              if ($elapsed -ge $timeout) {

                  throw "Tomcat did not stop within 180 seconds."

              }

          }


      # ============================================================
      # 9. Remove old expanded IdentityIQ
      # ============================================================

      - name: Remove Existing Expanded IdentityIQ
        shell: powershell
        run: |
          Write-Host "===== REMOVE EXPANDED IDENTITYIQ ====="

          if (Test-Path $env:IIQ_EXPLODED) {

              Remove-Item `
                  -Path $env:IIQ_EXPLODED `
                  -Recurse `
                  -Force

              Write-Host "Old expanded IdentityIQ directory removed."

          }
          else {

              Write-Host "Expanded IdentityIQ directory does not exist."

          }


      # ============================================================
      # 10. Remove old WAR
      # ============================================================

      - name: Remove Existing QA WAR
        shell: powershell
        run: |
          Write-Host "===== REMOVE EXISTING WAR ====="

          if (Test-Path $env:IIQ_WAR) {

              Remove-Item `
                  -Path $env:IIQ_WAR `
                  -Force

              Write-Host "Existing identityiq.war removed."

          }


      # ============================================================
      # 11. Deploy new WAR
      # ============================================================

      - name: Deploy New IdentityIQ WAR
        shell: powershell
        run: |
          Write-Host "===== DEPLOY NEW WAR ====="

          Copy-Item `
              -Path $env:WAR_PATH `
              -Destination $env:IIQ_WAR `
              -Force

          if (-not (Test-Path $env:IIQ_WAR)) {

              throw "New identityiq.war was not copied successfully."

          }

          Write-Host "New WAR deployed successfully:"
          Write-Host $env:IIQ_WAR


      # ============================================================
      # 12. Show deployed WAR checksum
      # ============================================================

      - name: Verify Deployed WAR
        shell: powershell
        run: |
          Write-Host "===== DEPLOYED WAR ====="

          Get-Item $env:IIQ_WAR

          Write-Host "===== DEPLOYED WAR SHA256 ====="

          Get-FileHash `
              -Path $env:IIQ_WAR `
              -Algorithm SHA256


      # ============================================================
      # 13. Start Tomcat
      # ============================================================

      - name: Start Tomcat
        shell: powershell
        run: |
          Write-Host "===== START TOMCAT ====="

          $status = sc.exe query $env:TOMCAT_SERVICE
          $status | Write-Host

          if ($status -match "RUNNING") {

              Write-Host "Tomcat is already running."

          }
          else {

              sc.exe start $env:TOMCAT_SERVICE

              if ($LASTEXITCODE -ne 0) {

                  throw "Unable to start Tomcat."

              }

          }


      # ============================================================
      # 14. Wait for Tomcat
      # ============================================================

      - name: Wait for Tomcat to Start
        shell: powershell
        run: |
          Write-Host "===== WAIT FOR TOMCAT ====="

          $timeout = 180
          $elapsed = 0

          while ($elapsed -lt $timeout) {

              $output = sc.exe query $env:TOMCAT_SERVICE
              $output | Write-Host

              if ($output -match "RUNNING") {

                  Write-Host "Tomcat is RUNNING."
                  break

              }

              Start-Sleep -Seconds 5

              $elapsed += 5
          }

          if ($elapsed -ge $timeout) {

              throw "Tomcat did not reach RUNNING state within 180 seconds."

          }


      # ============================================================
      # 15. Final verification
      # ============================================================

      - name: Final Deployment Verification
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "      QA DEPLOYMENT SUMMARY"
          Write-Host "================================="

          Write-Host "Tomcat:"
          sc.exe query $env:TOMCAT_SERVICE

          Write-Host ""
          Write-Host "Deployed WAR:"
          Get-Item $env:IIQ_WAR

          Write-Host ""
          Write-Host "Rollback backup:"
          Write-Host $env:CURRENT_BACKUP

          Write-Host ""
          Write-Host "QA deployment completed successfully."
