name: Deploy IdentityIQ to QA

on:
  workflow_run:
    workflows:
      - Build and Publish IdentityIQ Artifact
    types:
      - completed
    branches:
      - feature/iiq85-qa-cd-pipeline

permissions:
  actions: read
  contents: read

concurrency:
  group: identityiq-qa-deployment
  cancel-in-progress: false

jobs:
  deploy-to-qa:
    name: Deploy IdentityIQ WAR to QA

    # Deploy only when the CI workflow completes successfully.
    if: github.event.workflow_run.conclusion == 'success'

    runs-on:
      - self-hosted
      - Windows

    env:
      TOMCAT_SERVICE: Tomcat9
      IIQ_WAR: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq.war'
      IIQ_EXPLODED: 'C:\Program Files\Apache Software Foundation\Tomcat 9.0\webapps\identityiq'
      DOWNLOAD_DIR: 'C:\actions-runner\_work\_deploy\iiq'
      BACKUP_DIR: 'C:\IIQ_Backup'

    steps:

      # =====================================================
      # 1. SHOW CI AND RUNNER INFORMATION
      # =====================================================

      - name: Show CI and Runner Information
        shell: powershell
        run: |
          Write-Host "===== CI WORKFLOW INFORMATION ====="
          Write-Host "CI Workflow: ${{ github.event.workflow_run.name }}"
          Write-Host "CI Run ID: ${{ github.event.workflow_run.id }}"
          Write-Host "CI Run Number: ${{ github.event.workflow_run.run_number }}"
          Write-Host "CI Branch: ${{ github.event.workflow_run.head_branch }}"
          Write-Host "CI Commit: ${{ github.event.workflow_run.head_sha }}"
          Write-Host "CI Conclusion: ${{ github.event.workflow_run.conclusion }}"

          Write-Host ""
          Write-Host "===== QA RUNNER IDENTITY ====="
          hostname
          whoami
          whoami /user

          Write-Host ""
          Write-Host "===== TOMCAT CURRENT STATUS ====="
          sc.exe query $env:TOMCAT_SERVICE

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to query the Tomcat service."
          }


      # =====================================================
      # 2. PREPARE DOWNLOAD DIRECTORY
      # =====================================================

      - name: Prepare Download Directory
        shell: powershell
        run: |
          Write-Host "===== PREPARE DOWNLOAD DIRECTORY ====="

          if (Test-Path $env:DOWNLOAD_DIR) {
              Remove-Item `
                -Path $env:DOWNLOAD_DIR `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $env:DOWNLOAD_DIR `
            -Force | Out-Null

          if (-not (Test-Path $env:DOWNLOAD_DIR)) {
              throw "Download directory could not be created."
          }

          Write-Host "Download directory:"
          Write-Host $env:DOWNLOAD_DIR


      # =====================================================
      # 3. DOWNLOAD DYNAMIC CI ARTIFACT
      # =====================================================

      - name: Download CI Artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          pattern: identityiq-*
          path: ${{ env.DOWNLOAD_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}


      # =====================================================
      # 4. LOCATE THE WAR FILE
      # =====================================================

      - name: Locate WAR
        shell: powershell
        run: |
          Write-Host "===== DOWNLOADED FILES ====="

          Get-ChildItem `
            -Path $env:DOWNLOAD_DIR `
            -Recurse |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          $warFiles = @(
              Get-ChildItem `
                -Path $env:DOWNLOAD_DIR `
                -Recurse `
                -Filter "*.war" `
                -File
          )

          if ($warFiles.Count -eq 0) {
              throw "No WAR file was found in the downloaded identityiq-* artifact."
          }

          if ($warFiles.Count -gt 1) {
              Write-Host "Multiple WAR files were found:"
              $warFiles.FullName | Write-Host
              throw "Deployment stopped because multiple WAR files were found."
          }

          $war = $warFiles[0]

          if ($war.Length -le 0) {
              throw "The downloaded WAR file is empty."
          }

          Write-Host "WAR located:"
          Write-Host $war.FullName

          Write-Host "WAR size:"
          Write-Host $war.Length

          "WAR_PATH=$($war.FullName)" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # =====================================================
      # 5. CALCULATE SOURCE WAR CHECKSUM
      # =====================================================

      - name: Calculate Downloaded WAR SHA256
        shell: powershell
        run: |
          Write-Host "===== SOURCE WAR SHA256 ====="

          if (-not (Test-Path $env:WAR_PATH)) {
              throw "Downloaded WAR file does not exist."
          }

          $sourceHash = Get-FileHash `
            -Path $env:WAR_PATH `
            -Algorithm SHA256

          Write-Host "Source WAR:"
          Write-Host $sourceHash.Path

          Write-Host "Source SHA256:"
          Write-Host $sourceHash.Hash

          "SOURCE_WAR_HASH=$($sourceHash.Hash)" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # =====================================================
      # 6. PREPARE ROLLBACK DIRECTORY
      # =====================================================

      - name: Prepare Rollback Directory
        shell: powershell
        run: |
          Write-Host "===== PREPARE ROLLBACK DIRECTORY ====="

          if (-not (Test-Path $env:BACKUP_DIR)) {
              New-Item `
                -ItemType Directory `
                -Path $env:BACKUP_DIR `
                -Force | Out-Null
          }

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          $backup = Join-Path `
            -Path $env:BACKUP_DIR `
            -ChildPath "deployment-$timestamp"

          New-Item `
            -ItemType Directory `
            -Path $backup `
            -Force | Out-Null

          if (-not (Test-Path $backup)) {
              throw "Rollback directory could not be created."
          }

          "CURRENT_BACKUP=$backup" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "Rollback directory:"
          Write-Host $backup


      # =====================================================
      # 7. BACK UP CURRENT QA WAR
      # =====================================================

      - name: Backup Current QA WAR
        shell: powershell
        run: |
          Write-Host "===== BACKUP CURRENT QA WAR ====="

          if (Test-Path $env:IIQ_WAR) {
              $backupWar = Join-Path `
                -Path $env:CURRENT_BACKUP `
                -ChildPath "identityiq.war"

              Copy-Item `
                -Path $env:IIQ_WAR `
                -Destination $backupWar `
                -Force

              if (-not (Test-Path $backupWar)) {
                  throw "Existing QA WAR backup failed."
              }

              $backupHash = Get-FileHash `
                -Path $backupWar `
                -Algorithm SHA256

              Write-Host "Current QA WAR backed up successfully."
              Write-Host "Backup WAR:"
              Write-Host $backupWar

              Write-Host "Backup SHA256:"
              Write-Host $backupHash.Hash
          }
          else {
              Write-Host "No existing identityiq.war was found."
              Write-Host "This deployment will continue without an old WAR backup."
          }


      # =====================================================
      # 8. STOP TOMCAT
      # =====================================================

      - name: Stop Tomcat
        shell: powershell
        run: |
          Write-Host "===== TOMCAT STATUS BEFORE STOP ====="

          $status = sc.exe query $env:TOMCAT_SERVICE
          $status | Write-Host

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to query Tomcat before stopping it."
          }

          if ($status -match "STOPPED") {
              Write-Host "Tomcat is already STOPPED."
          }
          else {
              Write-Host "===== STOPPING TOMCAT ====="

              sc.exe stop $env:TOMCAT_SERVICE

              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to send the stop command to Tomcat."
              }

              $timeout = 180
              $elapsed = 0
              $stopped = $false

              Write-Host "Waiting up to 180 seconds for Tomcat to stop."

              while ($elapsed -lt $timeout) {
                  Start-Sleep -Seconds 5
                  $elapsed += 5

                  $output = sc.exe query $env:TOMCAT_SERVICE
                  $output | Write-Host

                  if ($output -match "STOPPED") {
                      $stopped = $true
                      Write-Host "Tomcat stopped successfully."
                      break
                  }
              }

              if (-not $stopped) {
                  throw "Tomcat did not stop within 180 seconds."
              }
          }


      # =====================================================
      # 9. REMOVE OLD EXPANDED IDENTITYIQ
      # =====================================================

      - name: Remove Existing Expanded IdentityIQ
        shell: powershell
        run: |
          Write-Host "===== REMOVE EXPANDED IDENTITYIQ ====="

          if (Test-Path $env:IIQ_EXPLODED) {
              Remove-Item `
                -Path $env:IIQ_EXPLODED `
                -Recurse `
                -Force

              if (Test-Path $env:IIQ_EXPLODED) {
                  throw "Expanded IdentityIQ directory could not be removed."
              }

              Write-Host "Old expanded IdentityIQ directory removed."
          }
          else {
              Write-Host "Expanded IdentityIQ directory is not present."
          }


      # =====================================================
      # 10. REMOVE OLD QA WAR
      # =====================================================

      - name: Remove Existing QA WAR
        shell: powershell
        run: |
          Write-Host "===== REMOVE EXISTING QA WAR ====="

          if (Test-Path $env:IIQ_WAR) {
              Remove-Item `
                -Path $env:IIQ_WAR `
                -Force

              if (Test-Path $env:IIQ_WAR) {
                  throw "Existing QA WAR could not be removed."
              }

              Write-Host "Existing QA WAR removed."
          }
          else {
              Write-Host "Existing QA WAR is not present."
          }


      # =====================================================
      # 11. DEPLOY NEW WAR
      # =====================================================

      - name: Deploy New IdentityIQ WAR
        shell: powershell
        run: |
          Write-Host "===== DEPLOY NEW IDENTITYIQ WAR ====="

          Write-Host "Source WAR:"
          Write-Host $env:WAR_PATH

          Write-Host "Destination WAR:"
          Write-Host $env:IIQ_WAR

          Copy-Item `
            -Path $env:WAR_PATH `
            -Destination $env:IIQ_WAR `
            -Force

          if (-not (Test-Path $env:IIQ_WAR)) {
              throw "New IdentityIQ WAR was not copied to QA."
          }

          $deployedWar = Get-Item $env:IIQ_WAR

          if ($deployedWar.Length -le 0) {
              throw "The deployed IdentityIQ WAR is empty."
          }

          Write-Host "New IdentityIQ WAR deployed successfully."
          Write-Host "Deployed size:"
          Write-Host $deployedWar.Length


      # =====================================================
      # 12. VERIFY DEPLOYED WAR CHECKSUM
      # =====================================================

      - name: Verify Deployed WAR SHA256
        shell: powershell
        run: |
          Write-Host "===== VERIFY DEPLOYED WAR ====="

          $deployedHash = Get-FileHash `
            -Path $env:IIQ_WAR `
            -Algorithm SHA256

          Write-Host "Source SHA256:"
          Write-Host $env:SOURCE_WAR_HASH

          Write-Host "Deployed SHA256:"
          Write-Host $deployedHash.Hash

          if ($deployedHash.Hash -ne $env:SOURCE_WAR_HASH) {
              throw "WAR SHA256 verification failed after deployment."
          }

          Write-Host "WAR SHA256 verification successful."


      # =====================================================
      # 13. START TOMCAT
      # =====================================================

      - name: Start Tomcat
        shell: powershell
        run: |
          Write-Host "===== TOMCAT STATUS BEFORE START ====="

          $status = sc.exe query $env:TOMCAT_SERVICE
          $status | Write-Host

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to query Tomcat before starting it."
          }

          if ($status -match "RUNNING") {
              Write-Host "Tomcat is already RUNNING."
          }
          else {
              Write-Host "===== STARTING TOMCAT ====="

              sc.exe start $env:TOMCAT_SERVICE

              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to start Tomcat."
              }
          }


      # =====================================================
      # 14. WAIT FOR TOMCAT TO START
      # =====================================================

      - name: Wait for Tomcat to Start
        shell: powershell
        run: |
          Write-Host "===== WAIT FOR TOMCAT ====="

          $timeout = 180
          $elapsed = 0
          $running = $false

          Write-Host "Waiting up to 180 seconds for Tomcat to start."

          while ($elapsed -lt $timeout) {
              Start-Sleep -Seconds 5
              $elapsed += 5

              $output = sc.exe query $env:TOMCAT_SERVICE
              $output | Write-Host

              if ($output -match "RUNNING") {
                  $running = $true
                  Write-Host "Tomcat is RUNNING."
                  break
              }
          }

          if (-not $running) {
              throw "Tomcat did not reach RUNNING state within 180 seconds."
          }


      # =====================================================
      # 15. WAIT FOR IDENTITYIQ WAR EXPANSION
      # =====================================================

      - name: Wait for IdentityIQ Deployment
        shell: powershell
        run: |
          Write-Host "===== WAIT FOR IDENTITYIQ EXPANSION ====="

          $timeout = 300
          $elapsed = 0
          $expanded = $false

          Write-Host "Waiting up to 300 seconds for Tomcat to expand identityiq.war."

          while ($elapsed -lt $timeout) {
              if (Test-Path $env:IIQ_EXPLODED) {
                  $expanded = $true
                  Write-Host "IdentityIQ expanded directory is present."
                  break
              }

              Start-Sleep -Seconds 10
              $elapsed += 10
          }

          if (-not $expanded) {
              throw "IdentityIQ expanded directory was not created within 300 seconds."
          }


      # =====================================================
      # 16. FINAL DEPLOYMENT VERIFICATION
      # =====================================================

      - name: Final Deployment Verification
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "       IDENTITYIQ QA DEPLOYMENT"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "CI Workflow:"
          Write-Host "${{ github.event.workflow_run.name }}"

          Write-Host ""
          Write-Host "CI Run ID:"
          Write-Host "${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "CI Commit:"
          Write-Host "${{ github.event.workflow_run.head_sha }}"

          Write-Host ""
          Write-Host "Tomcat Status:"
          sc.exe query $env:TOMCAT_SERVICE

          Write-Host ""
          Write-Host "Deployed WAR:"
          Get-Item $env:IIQ_WAR |
            Format-List FullName, Length, LastWriteTime

          Write-Host ""
          Write-Host "Deployed WAR SHA256:"
          Get-FileHash `
            -Path $env:IIQ_WAR `
            -Algorithm SHA256

          Write-Host ""
          Write-Host "Expanded IdentityIQ directory:"
          Get-Item $env:IIQ_EXPLODED |
            Format-List FullName, LastWriteTime

          Write-Host ""
          Write-Host "Rollback location:"
          Write-Host $env:CURRENT_BACKUP

          Write-Host ""
          Write-Host "IdentityIQ QA deployment completed successfully."
