name: Test Tomcat Permissions

on:
  workflow_dispatch:

  push:
    branches:
      - feature/iiq85-qa-cd-pipeline

jobs:
  test-tomcat:
    runs-on:
      - self-hosted
      - Windows

    steps:

      - name: Check Runner Identity and Permissions
        shell: powershell
        run: |
          Write-Host "===== RUNNER IDENTITY ====="
          whoami

          Write-Host "===== USER SID ====="
          whoami /user

          Write-Host "===== USER GROUPS ====="
          whoami /groups

          Write-Host "===== TOMCAT CURRENT STATUS ====="
          sc.exe query Tomcat9

      - name: Test Tomcat permissions
        shell: powershell
        run: |
          Write-Host "===== STOP TOMCAT USING SC.EXE ====="

          sc.exe stop Tomcat9

          if ($LASTEXITCODE -ne 0) {
              throw "sc.exe could not stop Tomcat9. Exit code: $LASTEXITCODE"
          }

          Write-Host "===== WAITING FOR TOMCAT TO STOP ====="

          $timeout = 60
          $elapsed = 0

          while ($elapsed -lt $timeout) {

              $output = sc.exe query Tomcat9
              $output | Write-Host

              if ($output -match "STOPPED") {
                  Write-Host "Tomcat stopped successfully."
                  break
              }

              Start-Sleep -Seconds 5
              $elapsed += 5
          }

          if ($elapsed -ge $timeout) {
              throw "Tomcat did not stop within 60 seconds."
          }

      - name: Final Tomcat Status
        shell: powershell
        run: |
          Write-Host "===== FINAL TOMCAT STATUS ====="
          sc.exe query Tomcat9
