name: CI - Build & Validate (SailPoint IIQ)

on:
  # Run the MCP integration when a PR targeting develop is
  # opened, updated, reopened, or has its title edited.
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - edited

  # Run full SailPoint CI after an approved PR is merged
  # into develop. The merge produces a push event.
  push:
    branches:
      - develop

  # Manual execution retained for POC/testing.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.12"
  CONFIG_DIR: "config"

  # SSB target configuration
  SPTARGET: "test"

  IIQ_VERSION: "8.5"
  IIQ_PACKAGE_PATH: "base/ga/identityiq-8.5.zip"
  WAR_PATH: "build/deploy/identityiq.war"

jobs:

  # =========================================================
  # JOB 1 - VALIDATIONS
  #
  # Runs after merge to develop or through manual execution.
  # It does not run when the PR is initially raised.
  # =========================================================
  validate:
    name: Validate SailPoint Changes

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SSB Structure
        shell: bash
        run: |
          echo "Validating SailPoint SSB structure..."

          status=0

          required_files=(
            "build.xml"
            "build.properties"
            "scripts/build.filelayout.xml"
            "scripts/build.java.xml"
          )

          required_dirs=(
            "base"
            "config"
            "scripts"
            "src"
            "lib"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              status=1
            else
              echo "PASS: $file"
            fi
          done

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir directory is missing"
              status=1
            else
              echo "PASS: $dir"
            fi
          done

          exit "$status"

      # -------------------------------------------------------
      # XML lint
      # -------------------------------------------------------
      - name: Install XML Lint
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          xmllint --version

      - name: Validate IIQ XML Files
        shell: bash
        run: |
          echo "Validating SailPoint XML files..."

          status=0
          count=0

          if [ ! -d "$CONFIG_DIR" ]; then
            echo "::error::$CONFIG_DIR directory not found"
            exit 1
          fi

          while IFS= read -r -d '' file; do
            count=$((count + 1))

            echo "Checking: $file"

            if ! xmllint --noout "$file" 2>/tmp/xml_error; then
              echo "::error file=$file::$(head -n 1 /tmp/xml_error)"
              status=1
            else
              echo "PASS: $file"
            fi
          done < <(
            find "$CONFIG_DIR" \
              -type f \
              -name "*.xml" \
              -print0
          )

          echo "Checked $count XML files"

          exit "$status"

      # -------------------------------------------------------
      # Secret scanning
      # -------------------------------------------------------
      - name: Scan Repository for Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =========================================================
  # JOB 2 - BUILD VALIDATION
  #
  # Runs only after the validation job succeeds.
  # =========================================================
  build:
    name: Build Validation

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    needs:
      - validate

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # OpenJDK 17
      # -------------------------------------------------------
      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java
        shell: bash
        run: |
          java -version

      # -------------------------------------------------------
      # Apache Ant
      # -------------------------------------------------------
      - name: Install Apache Ant
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant unzip
          ant -version

      - name: Verify SSB Ant Configuration
        shell: bash
        run: |
          ant -p

      # -------------------------------------------------------
      # Download IdentityIQ 8.5 package
      # -------------------------------------------------------
      - name: Download IdentityIQ 8.5 Base Package
        shell: bash
        env:
          IIQ_BLOB_SAS_URL: ${{ secrets.IIQ_BLOB_SAS_URL }}
        run: |
          if [ -z "$IIQ_BLOB_SAS_URL" ]; then
            echo "::error::IIQ_BLOB_SAS_URL secret is not configured"
            exit 1
          fi

          mkdir -p base/ga

          echo "Downloading IdentityIQ $IIQ_VERSION..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output "$IIQ_PACKAGE_PATH" \
            "$IIQ_BLOB_SAS_URL"

          if [ ! -s "$IIQ_PACKAGE_PATH" ]; then
            echo "::error::IdentityIQ package download failed"
            exit 1
          fi

          echo "IdentityIQ package downloaded successfully"
          ls -lh "$IIQ_PACKAGE_PATH"

      # -------------------------------------------------------
      # Validate ZIP
      # -------------------------------------------------------
      - name: Validate IdentityIQ Package
        shell: bash
        run: |
          echo "Validating IdentityIQ package..."

          unzip -t "$IIQ_PACKAGE_PATH" > /tmp/iiq-zip-check.txt

          tail -n 5 /tmp/iiq-zip-check.txt

          echo "IdentityIQ package validation passed"

      # -------------------------------------------------------
      # Verify IIQ version
      # -------------------------------------------------------
      - name: Verify IdentityIQ Version
        shell: bash
        run: |
          BUILD_VERSION=$(grep '^IIQVersion=' build.properties \
            | cut -d '=' -f2 \
            | tr -d '\r[:space:]')

          echo "Pipeline IIQ version: $IIQ_VERSION"
          echo "build.properties IIQ version: $BUILD_VERSION"

          if [ "$BUILD_VERSION" != "$IIQ_VERSION" ]; then
            echo "::error::IdentityIQ version mismatch"
            exit 1
          fi

          echo "IdentityIQ versions match"

      # -------------------------------------------------------
      # SSB build validation
      # -------------------------------------------------------
      - name: Compile and Validate SSB
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          echo "SPTARGET=$SPTARGET"
          echo "Running SailPoint SSB build..."

          ant main

      # -------------------------------------------------------
      # Dependency vulnerability scan intentionally deferred.
      # Unit tests are not included in current POC.
      # -------------------------------------------------------
      - name: Build Validation Summary
        shell: bash
        run: |
          echo "SSB build completed successfully."
          echo "SPTARGET used: $SPTARGET"
          echo "Dependency vulnerability scanning is deferred for the current POC."


  # =========================================================
  # JOB 3 - BUILD AND PUBLISH DEPLOYMENT ARTIFACT
  # =========================================================
  artifact:
    name: Build and Publish IdentityIQ Artifact

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    needs:
      - validate
      - build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Apache Ant
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant unzip
          ant -version

      # -------------------------------------------------------
      # Fresh runner requires IIQ package again
      # -------------------------------------------------------
      - name: Download IdentityIQ 8.5 Base Package
        shell: bash
        env:
          IIQ_BLOB_SAS_URL: ${{ secrets.IIQ_BLOB_SAS_URL }}
        run: |
          if [ -z "$IIQ_BLOB_SAS_URL" ]; then
            echo "::error::IIQ_BLOB_SAS_URL secret is not configured"
            exit 1
          fi

          mkdir -p base/ga

          echo "Downloading IdentityIQ $IIQ_VERSION..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output "$IIQ_PACKAGE_PATH" \
            "$IIQ_BLOB_SAS_URL"

          if [ ! -s "$IIQ_PACKAGE_PATH" ]; then
            echo "::error::IdentityIQ package download failed"
            exit 1
          fi

          echo "IdentityIQ package downloaded successfully"
          ls -lh "$IIQ_PACKAGE_PATH"

      # -------------------------------------------------------
      # Generate WAR
      # -------------------------------------------------------
      - name: Build IdentityIQ WAR
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          echo "SPTARGET=$SPTARGET"
          echo "Building IdentityIQ WAR..."

          ant war

      # -------------------------------------------------------
      # Verify and version WAR
      # -------------------------------------------------------
      - name: Version Deployment Artifact
        id: artifact
        shell: bash
        run: |
          if [ ! -f "$WAR_PATH" ]; then
            echo "::error::WAR not found at $WAR_PATH"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"

          ARTIFACT_NAME="identityiq-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          mkdir -p dist

          cp "$WAR_PATH" \
            "dist/${ARTIFACT_NAME}.war"

          cd dist

          sha256sum "${ARTIFACT_NAME}.war" \
            > "${ARTIFACT_NAME}.war.sha256"

          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          echo "Artifact created:"
          echo "${ARTIFACT_NAME}.war"

          echo "Checksum:"
          cat "${ARTIFACT_NAME}.war.sha256"

      # -------------------------------------------------------
      # Publish WAR
      # -------------------------------------------------------
      - name: Publish IdentityIQ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error


  # =========================================================
  # JOB 4 - UPDATE AZURE DEVOPS USER STORY
  #
  # This job runs only for pull_request events.
  #
  # Expected PR title:
  # US-12345: Implement SailPoint feature
  # =========================================================
  update-user-story:
    name: Update Azure DevOps User Story

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Extract Azure DevOps User Story ID from the PR title
      # -------------------------------------------------------
      - name: Extract User Story ID from PR Title
        id: user-story
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"

          US_ID=$(printf '%s\n' "$PR_TITLE" \
            | grep -oiE 'US-[0-9]+' \
            | head -1 \
            | cut -d'-' -f2)

          if [ -z "$US_ID" ]; then
            echo "::error::User Story ID was not found in the PR title."
            echo "::error::Expected PR title format: US-12345: Implement feature"
            exit 1
          fi

          if ! [[ "$US_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid User Story ID: $US_ID"
            exit 1
          fi

          echo "Azure DevOps User Story ID: $US_ID"
          echo "workitem_id=$US_ID" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------
      # Set up Python
      # -------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # -------------------------------------------------------
      # Install the official MCP Python SDK
      # -------------------------------------------------------
      - name: Install MCP Python SDK
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install mcp

          python --version
          python -m pip show mcp

      # -------------------------------------------------------
      # Confirm that mcp_client.py is present in the repository
      # -------------------------------------------------------
      - name: Verify MCP Client
        shell: bash
        run: |
          MCP_CLIENT_PATH="tools/mcp-client/mcp_client.py"

          if [ ! -f "$MCP_CLIENT_PATH" ]; then
            echo "::error::$MCP_CLIENT_PATH was not found"
            echo "::error::Add mcp_client.py to tools/mcp-client/"
            exit 1
          fi

          echo "MCP client found: $MCP_CLIENT_PATH"

      # -------------------------------------------------------
      # Validate required runtime configuration
      # -------------------------------------------------------
      - name: Validate MCP Configuration
        shell: bash
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
        run: |
          if [ -z "$MCP_SERVER_URL" ]; then
            echo "::error::MCP_SERVER_URL secret is not configured"
            exit 1
          fi

          case "$MCP_SERVER_URL" in
            https://*)
              echo "MCP server URL is configured."
              ;;
            *)
              echo "::error::MCP_SERVER_URL must use HTTPS"
              exit 1
              ;;
          esac

      # -------------------------------------------------------
      # The Python client calls only:
      #
      # 1. get_work_item
      # 2. update_work_item
      # -------------------------------------------------------
      - name: Fetch and Update User Story through MCP
        shell: bash
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          WORK_ITEM_ID: ${{ steps.user-story.outputs.workitem_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Azure DevOps User Story: $WORK_ITEM_ID"
          echo "GitHub PR number: $PR_NUMBER"
          echo "GitHub PR URL: $PR_URL"

          python tools/mcp-client/mcp_client.py

      - name: MCP Update Summary
        if: success()
        shell: bash
        env:
          WORK_ITEM_ID: ${{ steps.user-story.outputs.workitem_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Azure DevOps User Story update completed."
          echo "Work Item ID: $WORK_ITEM_ID"
          echo "Pull Request: $PR_URL"
