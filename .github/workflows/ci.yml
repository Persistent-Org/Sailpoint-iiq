name: CI - Build & Validate (SailPoint IIQ)

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "bugfix/**"

  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  CONFIG_DIR: "config"
  SPTARGET: "sandbox"
  IIQ_VERSION: "8.5"
  IIQ_PACKAGE_PATH: "base/ga/identityiq-8.5.zip"
  WAR_PATH: "build/deploy/identityiq.war"

jobs:

  # =========================================================
  # JOB 1 - VALIDATION
  # =========================================================
  validate:
    name: Validate SailPoint Changes
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SSB Structure
        shell: bash
        run: |
          echo "Validating SailPoint SSB structure..."

          status=0

          required_files=(
            "build.xml"
            "build.properties"
            "scripts/build.filelayout.xml"
            "scripts/build.java.xml"
          )

          required_dirs=(
            "base"
            "config"
            "scripts"
            "src"
            "lib"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              status=1
            else
              echo "PASS: $file"
            fi
          done

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir directory is missing"
              status=1
            else
              echo "PASS: $dir"
            fi
          done

          exit "$status"

      # -------------------------------------------------------
      # XML lint
      # -------------------------------------------------------
      - name: Install XML Lint
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          xmllint --version

      - name: Validate IIQ XML Files
        shell: bash
        run: |
          echo "Validating SailPoint XML files..."

          status=0
          count=0

          if [ ! -d "$CONFIG_DIR" ]; then
            echo "::error::$CONFIG_DIR directory not found"
            exit 1
          fi

          while IFS= read -r -d '' file; do
            count=$((count + 1))

            echo "Checking: $file"

            if ! xmllint --noout "$file" 2>/tmp/xml_error; then
              echo "::error file=$file::$(head -n 1 /tmp/xml_error)"
              status=1
            else
              echo "PASS: $file"
            fi

          done < <(
            find "$CONFIG_DIR" \
              -type f \
              -name "*.xml" \
              -print0
          )

          echo "Checked $count XML files"

          exit "$status"

      # -------------------------------------------------------
      # Secret scanning
      # -------------------------------------------------------
      - name: Scan Repository for Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =========================================================
  # JOB 2 - BUILD VALIDATION
  # =========================================================
  build:
    name: Build Validation
    needs: validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # OpenJDK 17
      # -------------------------------------------------------
      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java
        shell: bash
        run: |
          java -version

      # -------------------------------------------------------
      # Apache Ant
      # -------------------------------------------------------
      - name: Install Apache Ant
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant unzip

          ant -version

      - name: Verify SSB Ant Configuration
        shell: bash
        run: |
          ant -p

      # -------------------------------------------------------
      # Download IdentityIQ 8.5 package from Azure Blob
      # -------------------------------------------------------
      - name: Download IdentityIQ 8.5 Base Package
        shell: bash
        env:
          IIQ_BLOB_SAS_URL: ${{ secrets.IIQ_BLOB_SAS_URL }}
        run: |
          if [ -z "$IIQ_BLOB_SAS_URL" ]; then
            echo "::error::IIQ_BLOB_SAS_URL secret is not configured"
            exit 1
          fi

          mkdir -p base/ga

          echo "Downloading IdentityIQ $IIQ_VERSION..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output "$IIQ_PACKAGE_PATH" \
            "$IIQ_BLOB_SAS_URL"

          if [ ! -s "$IIQ_PACKAGE_PATH" ]; then
            echo "::error::IdentityIQ package download failed"
            exit 1
          fi

          echo "IdentityIQ package downloaded successfully"

          ls -lh "$IIQ_PACKAGE_PATH"

      # -------------------------------------------------------
      # Validate ZIP
      # -------------------------------------------------------
      - name: Validate IdentityIQ Package
        shell: bash
        run: |
          echo "Validating IdentityIQ package..."

          unzip -t "$IIQ_PACKAGE_PATH" > /tmp/iiq-zip-check.txt

          tail -n 5 /tmp/iiq-zip-check.txt

          echo "IdentityIQ package validation passed"

      # -------------------------------------------------------
      # Verify IIQ version
      # -------------------------------------------------------
      - name: Verify IdentityIQ Version
        shell: bash
        run: |
          BUILD_VERSION=$(grep '^IIQVersion=' build.properties \
            | cut -d '=' -f2 \
            | tr -d '\r[:space:]')

          echo "Pipeline IIQ version: $IIQ_VERSION"
          echo "build.properties IIQ version: $BUILD_VERSION"

          if [ "$BUILD_VERSION" != "$IIQ_VERSION" ]; then
            echo "::error::IdentityIQ version mismatch"
            exit 1
          fi

          echo "IdentityIQ versions match"

      # -------------------------------------------------------
      # SSB build / compilation
      # Unit tests are not included in current POC.
      # -------------------------------------------------------
      - name: Compile and Validate SSB
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          echo "Running SailPoint SSB build..."

          ant main

      # -------------------------------------------------------
      # Dependency vulnerability scan intentionally deferred.
      #
      # Existing ant dependency-check fails while retrieving
      # NVD vulnerability data.
      #
      # To be addressed separately after confirmation from
      # SailPoint/Security team.
      # -------------------------------------------------------

      - name: Build Validation Summary
        shell: bash
        run: |
          echo "SSB build completed successfully."
          echo "Dependency vulnerability scanning is deferred for the current POC."


  # =========================================================
  # JOB 3 - BUILD AND PUBLISH DEPLOYMENT ARTIFACT
  # =========================================================
  artifact:
    name: Build and Publish IdentityIQ Artifact

    needs:
      - validate
      - build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Apache Ant
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant unzip

          ant -version

      # -------------------------------------------------------
      # Every GitHub Actions job gets a clean runner.
      # Download IIQ package again before WAR generation.
      # -------------------------------------------------------
      - name: Download IdentityIQ 8.5 Base Package
        shell: bash
        env:
          IIQ_BLOB_SAS_URL: ${{ secrets.IIQ_BLOB_SAS_URL }}
        run: |
          if [ -z "$IIQ_BLOB_SAS_URL" ]; then
            echo "::error::IIQ_BLOB_SAS_URL secret is not configured"
            exit 1
          fi

          mkdir -p base/ga

          echo "Downloading IdentityIQ $IIQ_VERSION..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output "$IIQ_PACKAGE_PATH" \
            "$IIQ_BLOB_SAS_URL"

          if [ ! -s "$IIQ_PACKAGE_PATH" ]; then
            echo "::error::IdentityIQ package download failed"
            exit 1
          fi

          echo "IdentityIQ package downloaded successfully"

          ls -lh "$IIQ_PACKAGE_PATH"

      # -------------------------------------------------------
      # Generate WAR
      # -------------------------------------------------------
      - name: Build IdentityIQ WAR
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          echo "Building IdentityIQ WAR..."

          ant war

      # -------------------------------------------------------
      # Verify and version WAR
      # -------------------------------------------------------
      - name: Version Deployment Artifact
        id: artifact
        shell: bash
        run: |
          if [ ! -f "$WAR_PATH" ]; then
            echo "::error::WAR not found at $WAR_PATH"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"

          ARTIFACT_NAME="identityiq-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          mkdir -p dist

          cp "$WAR_PATH" \
            "dist/${ARTIFACT_NAME}.war"

          cd dist

          sha256sum "${ARTIFACT_NAME}.war" \
            > "${ARTIFACT_NAME}.war.sha256"

          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          echo "Artifact created:"
          echo "${ARTIFACT_NAME}.war"

          echo "Checksum:"
          cat "${ARTIFACT_NAME}.war.sha256"

      # -------------------------------------------------------
      # Publish WAR artifact
      # -------------------------------------------------------
      - name: Publish IdentityIQ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error
