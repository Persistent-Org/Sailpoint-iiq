name: CI - Build & Validate (SailPoint IIQ)

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "bugfix/**"

  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Confirm this with the SailPoint team.
  JAVA_VERSION: "11"

  CONFIG_DIR: "config"

  # Your build.xml contains this target.
  ANT_BUILD_TARGET: "war"

  # Your build.xml creates the WAR here.
  WAR_PATH: "build/deploy/identityiq.war"

  # Your existing SSB properties contain sandbox target files.
  SPTARGET: "sandbox"

jobs:

  # ==========================================================
  # JOB 1 - VALIDATION
  # ==========================================================
  validate:
    name: Validate SailPoint Changes
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout complete repository
      # ------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # Validate required SSB structure
      # ------------------------------------------------------
      - name: Validate SSB Structure
        shell: bash
        run: |
          echo "Validating SailPoint SSB repository structure..."

          status=0

          required_files=(
            "build.xml"
            "build.properties"
          )

          required_directories=(
            "config"
            "scripts"
            "src"
            "lib"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              status=1
            else
              echo "PASS: $file"
            fi
          done

          for directory in "${required_directories[@]}"; do
            if [ ! -d "$directory" ]; then
              echo "::error::$directory directory is missing"
              status=1
            else
              echo "PASS: $directory"
            fi
          done

          exit "$status"

      # ------------------------------------------------------
      # Validate XML files
      # ------------------------------------------------------
      - name: Install XML Validation Tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils

      - name: Validate IIQ XML
        shell: bash
        run: |
          echo "Validating XML files under $CONFIG_DIR..."

          status=0
          count=0

          while IFS= read -r -d '' file; do

            count=$((count + 1))

            echo "Checking: $file"

            if ! xmllint --noout "$file" 2>/tmp/xml_error; then

              echo "::error file=$file::$(head -n 1 /tmp/xml_error)"

              status=1

            else

              echo "PASS: $file"

            fi

          done < <(find "$CONFIG_DIR" -type f -name "*.xml" -print0)

          echo "Checked $count XML files"

          exit "$status"

      # ------------------------------------------------------
      # Secret scanning
      # ------------------------------------------------------
      - name: Scan Repository for Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================
  # JOB 2 - BUILD AND SECURITY VALIDATION
  # ==========================================================
  build:
    name: Build and Security Validation
    needs: validate
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Java setup
      # ------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java
        shell: bash
        run: |
          echo "Java version:"
          java -version

      # ------------------------------------------------------
      # Ant setup
      # ------------------------------------------------------
      - name: Install Apache Ant
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant

          echo "Ant version:"
          ant -version

      # ------------------------------------------------------
      # Display available Ant targets
      # Useful for confirming SSB targets during POC
      # ------------------------------------------------------
      - name: Verify Ant Build Configuration
        shell: bash
        run: |
          echo "Available Ant targets:"
          ant -p

      # ------------------------------------------------------
      # Compile / base SSB build validation
      # ------------------------------------------------------
      - name: Compile and Validate SSB
        shell: bash
        run: |
          echo "Building for target: $SPTARGET"

          export SPTARGET="$SPTARGET"

          ant main

      # ------------------------------------------------------
      # Unit tests
      #
      # Runs only if an Ant 'test' target actually exists.
      # ------------------------------------------------------
      - name: Run Unit Tests
        shell: bash
        run: |
          if ant -p | grep -Eq '^[[:space:]]*test([[:space:]]|$)'; then

            echo "Unit test target found"

            ant test

          else

            echo "No Ant test target found."
            echo "Unit tests skipped for this build."

          fi

      # ------------------------------------------------------
      # Existing SSB dependency/security scan
      # ------------------------------------------------------
      - name: Run Dependency Security Check
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          ant dependency-check

      # ------------------------------------------------------
      # Upload dependency/security reports
      # ------------------------------------------------------
      - name: Publish Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: build/dependency-check-reports/**
          if-no-files-found: ignore


  # ==========================================================
  # JOB 3 - BUILD AND PUBLISH DEPLOYMENT ARTIFACT
  #
  # Enable this once WAR is confirmed as the official
  # deployment artifact.
  # ==========================================================
  build-artifact:
    name: Build and Publish IdentityIQ Artifact
    needs:
      - validate
      - build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Apache Ant
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant
          ant -version

      # ------------------------------------------------------
      # Generate IdentityIQ WAR
      # ------------------------------------------------------
      - name: Build IdentityIQ WAR
        shell: bash
        run: |
          export SPTARGET="$SPTARGET"

          echo "Running Ant target: $ANT_BUILD_TARGET"

          ant "$ANT_BUILD_TARGET"

      # ------------------------------------------------------
      # Verify, version and checksum artifact
      # ------------------------------------------------------
      - name: Version Deployment Artifact
        id: artifact
        shell: bash
        run: |
          if [ ! -f "$WAR_PATH" ]; then

            echo "::error::WAR not found at $WAR_PATH"

            exit 1

          fi

          SHORT_SHA="${GITHUB_SHA::7}"

          ARTIFACT_NAME="identityiq-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          mkdir -p dist

          cp "$WAR_PATH" "dist/${ARTIFACT_NAME}.war"

          (
            cd dist
            sha256sum "${ARTIFACT_NAME}.war" \
              > "${ARTIFACT_NAME}.war.sha256"
          )

          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          echo "Artifact created:"
          echo "${ARTIFACT_NAME}.war"

          echo "### SailPoint CI Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${ARTIFACT_NAME}.war\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256:" >> "$GITHUB_STEP_SUMMARY"
          cat "dist/${ARTIFACT_NAME}.war.sha256" \
            >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------
      # Publish artifact
      # ------------------------------------------------------
      - name: Publish IdentityIQ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error
