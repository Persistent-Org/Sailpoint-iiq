name: CI - Build & Validate (SailPoint IIQ)

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop
      - "test/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SECRET SCANNING
  # ============================================================
  gitleaks:
    name: Scan Repository for Secrets using Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}


  # ============================================================
  # 2. VALIDATE SAILPOINT CHANGES
  # Only starts when Gitleaks passes
  # ============================================================
  validate:
    name: Validate SailPoint Changes
    needs: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate required project files
        shell: bash
        run: |
          echo "Validating SailPoint IIQ project..."

          test -f build.xml || {
            echo "ERROR: build.xml not found"
            exit 1
          }

          test -f build.properties || {
            echo "ERROR: build.properties not found"
            exit 1
          }

          echo "Required build files found."
          echo "Validation completed successfully."


  # ============================================================
  # 3. BUILD VALIDATION
  # ============================================================
  build-validation:
    name: Build Validation
    needs:
      - gitleaks
      - validate

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          java -version

      - name: Install Ant
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Verify Ant
        shell: bash
        run: |
          ant -version

      # --------------------------------------------------------
      # IMPORTANT:
      # Keep your CURRENT WORKING build validation commands here.
      # Do not replace working IdentityIQ logic unnecessarily.
      # --------------------------------------------------------

      - name: Build Validation Summary
        shell: bash
        run: |
          echo "========================================"
          echo "SailPoint IdentityIQ Build Validation"
          echo "========================================"
          echo "Branch : $GITHUB_REF_NAME"
          echo "Commit : $GITHUB_SHA"
          echo "Java:"
          java -version 2>&1
          echo "Ant:"
          ant -version


  # ============================================================
  # 4. BUILD AND PUBLISH IDENTITYIQ ARTIFACT
  # ============================================================
  build-artifact:
    name: Build and Publish IdentityIQ Artifact
    needs:
      - gitleaks
      - validate
      - build-validation

    runs-on: ubuntu-latest

    env:
      SPTARGET: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Ant
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      # --------------------------------------------------------
      # Keep your existing IdentityIQ package download here.
      #
      # Your existing CI already downloads the IdentityIQ base
      # package using the Azure Blob SAS secret.
      #
      # Keep that working implementation unchanged.
      # --------------------------------------------------------

      - name: Verify build environment
        shell: bash
        run: |
          echo "SPTARGET=$SPTARGET"
          java -version
          ant -version

      # --------------------------------------------------------
      # IMPORTANT:
      # Replace this step with your CURRENT SUCCESSFUL Ant command
      # from the working ci.yml.
      # --------------------------------------------------------

      - name: Build IdentityIQ WAR
        shell: bash
        run: |
          echo "Run the existing successful IdentityIQ Ant build here"

          # Example only:
          # ant war

          # Keep the command from your existing successful CI.

      # --------------------------------------------------------
      # Keep your current artifact naming logic if already working.
      # --------------------------------------------------------

      - name: Generate versioned artifact name
        id: artifact
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSIONED_NAME="identityiq-${SPTARGET}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.war"

          echo "artifact_name=$VERSIONED_NAME" >> "$GITHUB_OUTPUT"
          echo "Artifact name: $VERSIONED_NAME"

      # --------------------------------------------------------
      # IMPORTANT:
      # Use the actual WAR path from your working pipeline.
      # --------------------------------------------------------

      - name: Copy WAR to dist
        shell: bash
        run: |
          mkdir -p dist

          echo "Use the existing WAR copy command from the working CI."
          echo "Expected artifact name:"
          echo "${{ steps.artifact.outputs.artifact_name }}"

          # Example only:
          # cp build/identityiq.war \
          #   "dist/${{ steps.artifact.outputs.artifact_name }}"

      - name: Generate checksum
        shell: bash
        run: |
          if compgen -G "dist/*.war" > /dev/null; then
            cd dist
            sha256sum *.war > SHA256SUMS.txt
            cat SHA256SUMS.txt
          else
            echo "ERROR: No WAR found under dist/"
            exit 1
          fi

      - name: Publish WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: identityiq-war-${{ github.run_number }}
          path: |
            dist/*.war
            dist/SHA256SUMS.txt
          if-no-files-found: error
